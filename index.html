<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Home VR</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  #gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
  #cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
  #start{position:fixed;left:0;top:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    text-align:center;padding:24px;background:radial-gradient(circle at 50% 25%,#26384d,#06080d)}
  #start h1{margin:0;font-size:34px}
  #start p{margin:0;max-width:340px;opacity:.7;line-height:1.45;font-size:15px}
  #start button{border:0;border-radius:999px;padding:15px 38px;font-size:17px;font-weight:700;background:#fff;color:#111;min-width:240px}
  #start button.sec{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
  #err{color:#ff9a9a;font-size:13px;min-height:16px;max-width:340px}
  #rot{position:fixed;left:0;top:0;right:0;bottom:0;z-index:20;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;
    background:rgba(0,0,0,.88);font-size:20px;line-height:1.4}
  #errbar{position:fixed;left:8px;right:8px;top:8px;z-index:99;display:none;background:rgba(160,30,30,.92);font-size:12px;padding:8px 12px;border-radius:12px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="gl"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="rot">Gire o celular para a horizontal<br>e coloque no VR Box</div>
<div id="errbar"></div>

<div id="start">
  <h1>Home VR</h1>
  <p>Coloque o celular na horizontal. O app vai pedir permissão de movimento e da câmera traseira (passthrough e rastreamento de mão).</p>
  <button id="bVR" type="button">Iniciar (VR Box)</button>
  <button id="bNormal" type="button" class="sec">Iniciar (tela normal)</button>
  <button id="bXR" type="button" style="display:none">Iniciar em WebXR VR (6DOF)</button>
  <button id="bAR" type="button" style="display:none">Iniciar em AR (Android, 6DOF)</button>
  <button id="bARS" type="button" class="sec" style="display:none">AR com tela dividida (VR Box)</button>
  <div id="xrNote" style="font-size:13px;opacity:.65;max-width:340px;line-height:1.4"></div>
  <button id="bFull" type="button" class="sec">Tela cheia</button>
  <div id="err"></div>
</div>

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i);};
function showErr(m){ try{ var b=$('errbar'); b.style.display='block'; b.textContent='Erro: '+((m&&m.message)||m); }catch(_){} }
window.addEventListener('error',function(e){ showErr(e.message); });
window.addEventListener('unhandledrejection',function(e){ showErr(e.reason); });

function goFull(){
  try{
    var el=document.documentElement;
    var f=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
    if(f){ var p=f.call(el); if(p&&p.catch) p.catch(function(){}); }
    if(screen.orientation&&screen.orientation.lock){ screen.orientation.lock('landscape').catch(function(){}); }
  }catch(e){}
}
$('bFull').addEventListener('click',goFull);

if(typeof THREE==='undefined'){
  $('err').textContent='Não foi possível carregar o Three.js. Verifique a internet e recarregue.';
  return;
}

/* ============================ ESTADO ============================ */
var DEF={q:3,aa:true,stereo:true,fov:80,ui:1,ipd:63,bubbles:true,nb:8,bcol:0,env:'passthrough',camOn:true,camOpa:100,camBri:100,hands:true,skel:true,sens:3,cube:true,cubeSize:14,cubeOne:false,maxHands:2};
var S={}; for(var k0 in DEF){ S[k0]=DEF[k0]; }
try{ var sv=JSON.parse(localStorage.getItem('homevr3')||'{}'); for(var k1 in sv){ if(k1 in DEF) S[k1]=sv[k1]; } }catch(e){}
function save(){ try{ localStorage.setItem('homevr3',JSON.stringify(S)); }catch(e){} }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function ease3(p){ return 1-Math.pow(1-p,3); }
function smooth(p){ return p*p*(3-2*p); }

var X={on:false,mode:'vr',split:false,supportedAR:false,saw:[false,false],supported:false,session:null,ref:null,floor:false,hasPose:false,dir:new THREE.Vector3(0,0,-1),headQ:new THREE.Quaternion(),sel:[false,false]};
/* direção "para frente" (-Z) de um quaternion, sem depender de métodos extras */
function fwdFromQ(q,out){ return out.set(-2*(q.x*q.z+q.w*q.y),-2*(q.y*q.z-q.w*q.x),-(1-2*(q.x*q.x+q.y*q.y))); }
var R={started:false,placed:false,startT:0,section:0,libOpen:true,libP:0,dockP:0,hover:null,libDirty:true,dockDirty:true,
  toast:'',toastStart:0,toastUntil:0,clock:'',bat:'',batLevel:-1,handModel:'aguardando',handN:0,lastClick:0,camFail:false,
  app:null,appDir:0,appP:0,appOrigin:new THREE.Vector3(),appTarget:new THREE.Vector3(),head:new THREE.Vector3(),org:new THREE.Vector3(),quickOpen:false,quickP:0,quickDirty:true};

/* ============================ RENDERER / CENA ============================ */
var canvas=$('gl');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setClearColor(0x000000,1);
renderer.xr.enabled=true; renderer.xr.setReferenceSpaceType('local-floor');
var scene=new THREE.Scene();
var rig=new THREE.Object3D(); scene.add(rig);
var camL=new THREE.PerspectiveCamera(S.fov,1,0.05,80);
var camR=new THREE.PerspectiveCamera(S.fov,1,0.05,80);
var camC=new THREE.PerspectiveCamera(S.fov,1,0.05,80);
rig.add(camL); rig.add(camR); rig.add(camC);
scene.add(new THREE.HemisphereLight(0xffffff,0x334455,0.95));
var dirLight=new THREE.DirectionalLight(0xffffff,0.6); dirLight.position.set(1,2,1); scene.add(dirLight);

var VW=1,VH=1,eyeA=1,BG=12,FW=1,FH=1;
var video=$('cam'), vtex=null, videoReady=false, MAP={rx:1,ry:1,ox:0,oy:0};

/* Plano de fundo com a câmera (passthrough) */
var bgGroup=new THREE.Group(); bgGroup.position.z=-BG; rig.add(bgGroup);
var vidMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,depthWrite:false,depthTest:false});
var vidPlane=new THREE.Mesh(new THREE.PlaneGeometry(1,1),vidMat);
vidPlane.renderOrder=-5; vidPlane.visible=false; vidPlane.frustumCulled=false; bgGroup.add(vidPlane);

/* Esqueletos das mãos (2 mãos) */
var HAND_CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function makeSkel(){
  var o={pos:new Float32Array(21*3),line:new Float32Array(HAND_CONN.length*2*3)};
  o.pg=new THREE.BufferGeometry(); o.pg.setAttribute('position',new THREE.BufferAttribute(o.pos,3));
  o.lg=new THREE.BufferGeometry(); o.lg.setAttribute('position',new THREE.BufferAttribute(o.line,3));
  o.pts=new THREE.Points(o.pg,new THREE.PointsMaterial({color:0x7dd3fc,size:7,sizeAttenuation:false,depthTest:false,transparent:true}));
  o.lin=new THREE.LineSegments(o.lg,new THREE.LineBasicMaterial({color:0x7dd3fc,depthTest:false,transparent:true,opacity:.8}));
  o.group=new THREE.Group(); o.group.add(o.lin); o.group.add(o.pts); o.group.visible=false; o.group.position.z=0.05;
  o.pts.renderOrder=-4; o.lin.renderOrder=-4; o.pts.frustumCulled=false; o.lin.frustumCulled=false;
  bgGroup.add(o.group); return o;
}

/* Céu / ambientes virtuais */
var sky=new THREE.Mesh(new THREE.SphereGeometry(30,32,16),new THREE.MeshBasicMaterial({side:THREE.BackSide,depthWrite:false}));
sky.renderOrder=-10; sky.visible=false; scene.add(sky);
var skyCache={};
function mkSky(id){
  var W=1024,Hh=512,c=document.createElement('canvas'); c.width=W; c.height=Hh; var g=c.getContext('2d');
  function grad(st){ var gr=g.createLinearGradient(0,0,0,Hh); st.forEach(function(s){ gr.addColorStop(s[0],s[1]); }); g.fillStyle=gr; g.fillRect(0,0,W,Hh); }
  var i;
  if(id==='sunset'){
    grad([[0,'#14143a'],[.3,'#6a2f8a'],[.45,'#e0566b'],[.499,'#ffb35c'],[.5,'#2b1735'],[1,'#0c0814']]);
    var rg=g.createRadialGradient(W/2,Hh*.5,2,W/2,Hh*.5,230);
    rg.addColorStop(0,'rgba(255,240,180,1)'); rg.addColorStop(.25,'rgba(255,170,90,.6)'); rg.addColorStop(1,'rgba(255,120,60,0)');
    g.fillStyle=rg; g.fillRect(0,0,W,Hh/2);
  }else if(id==='city'){
    grad([[0,'#04060f'],[.35,'#12204a'],[.499,'#2b3f7a'],[.5,'#080b14'],[1,'#03040a']]);
    for(var x=0;x<W;){ var bw=16+Math.random()*34, bh=20+Math.random()*120;
      g.fillStyle='#070b16'; g.fillRect(x,256-bh,bw,bh);
      for(var wy=256-bh+6;wy<250;wy+=9){ for(var wx=x+4;wx<x+bw-4;wx+=7){ if(Math.random()<.35){ g.fillStyle=Math.random()<.5?'#ffd27a':'#9fd2ff'; g.fillRect(wx,wy,3,4); } } }
      x+=bw+Math.random()*6; }
  }else if(id==='space'){
    grad([[0,'#000'],[1,'#000']]);
    [['rgba(120,60,200,.35)',200,140],['rgba(40,110,220,.3)',700,330],['rgba(220,80,150,.22)',520,90]].forEach(function(n){
      var r=g.createRadialGradient(n[1],n[2],10,n[1],n[2],220); r.addColorStop(0,n[0]); r.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=r; g.fillRect(0,0,W,Hh); });
    for(i=0;i<900;i++){ g.fillStyle='rgba(255,255,255,'+(0.3+Math.random()*.7)+')'; var s=Math.random()<.9?1:2; g.fillRect(Math.random()*W,Math.random()*Hh,s,s); }
  }else if(id==='beach'){
    grad([[0,'#3b8fe8'],[.35,'#8ccbff'],[.499,'#d6f0ff'],[.5,'#2fb4d6'],[.62,'#1a86b5'],[.63,'#ecd9a6'],[1,'#c9b27c']]);
    var sg=g.createRadialGradient(300,150,4,300,150,70); sg.addColorStop(0,'#fff'); sg.addColorStop(.3,'rgba(255,245,200,.9)'); sg.addColorStop(1,'rgba(255,245,200,0)');
    g.fillStyle=sg; g.fillRect(200,50,200,200);
  }else{
    grad([[0,'#0a0d14'],[1,'#030406']]);
  }
  var t=new THREE.CanvasTexture(c); t.minFilter=THREE.LinearFilter; t.generateMipmaps=false; return t;
}

/* ============================ ÍCONES VETORIAIS ============================ */
function ico(g,n,x,y,s,col,lw){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.strokeStyle=col||'#fff'; g.fillStyle=col||'#fff'; g.lineWidth=(lw||4)/s; g.lineCap='round'; g.lineJoin='round';
  g.beginPath();
  var i,a;
  switch(n){
    case 'home': g.moveTo(-.46,-.02); g.lineTo(0,-.44); g.lineTo(.46,-.02); g.moveTo(-.34,-.1); g.lineTo(-.34,.42); g.lineTo(.34,.42); g.lineTo(.34,-.1); g.moveTo(-.1,.42); g.lineTo(-.1,.14); g.lineTo(.1,.14); g.lineTo(.1,.42); break;
    case 'bubble': g.moveTo(.18,.08); g.arc(-.12,.08,.3,0,6.283); g.moveTo(.4,-.22); g.arc(.26,-.22,.14,0,6.283); g.moveTo(.3,.3); g.arc(.22,.3,.08,0,6.283); break;
    case 'sun': g.moveTo(.16,0); g.arc(0,0,.16,0,6.283); for(i=0;i<8;i++){ a=i*Math.PI/4; g.moveTo(Math.cos(a)*.27,Math.sin(a)*.27); g.lineTo(Math.cos(a)*.42,Math.sin(a)*.42); } break;
    case 'sunset': g.moveTo(-.46,.2); g.lineTo(.46,.2); g.moveTo(-.24,.2); g.arc(0,.2,.24,Math.PI,6.283); for(i=1;i<4;i++){ a=Math.PI+i*Math.PI/4; g.moveTo(Math.cos(a)*.33,.2+Math.sin(a)*.33); g.lineTo(Math.cos(a)*.46,.2+Math.sin(a)*.46); } g.moveTo(-.3,.34); g.lineTo(.3,.34); break;
    case 'camera': g.rect(-.46,-.28,.92,.66); g.moveTo(-.18,-.28); g.lineTo(-.1,-.42); g.lineTo(.1,-.42); g.lineTo(.18,-.28); g.moveTo(.2,.05); g.arc(0,.05,.2,0,6.283); break;
    case 'eye': g.moveTo(-.46,0); g.quadraticCurveTo(0,-.5,.46,0); g.quadraticCurveTo(0,.5,-.46,0); g.moveTo(.14,0); g.arc(0,0,.14,0,6.283); break;
    case 'hand': g.moveTo(-.24,.08); g.lineTo(-.24,-.3); g.moveTo(-.08,.08); g.lineTo(-.08,-.42); g.moveTo(.08,.08); g.lineTo(.08,-.4); g.moveTo(.24,.08); g.lineTo(.24,-.28); g.moveTo(-.3,.14); g.lineTo(-.46,-.02);
      g.moveTo(-.3,.05); g.lineTo(-.3,.3); g.quadraticCurveTo(-.3,.46,-.14,.46); g.lineTo(.14,.46); g.quadraticCurveTo(.3,.46,.3,.3); g.lineTo(.3,.05); break;
    case 'gear': g.moveTo(.26,0); g.arc(0,0,.26,0,6.283); g.moveTo(.1,0); g.arc(0,0,.1,0,6.283); for(i=0;i<8;i++){ a=i*Math.PI/4; g.moveTo(Math.cos(a)*.26,Math.sin(a)*.26); g.lineTo(Math.cos(a)*.44,Math.sin(a)*.44); } break;
    case 'cube': g.moveTo(0,-.46); g.lineTo(.4,-.23); g.lineTo(.4,.23); g.lineTo(0,.46); g.lineTo(-.4,.23); g.lineTo(-.4,-.23); g.closePath(); g.moveTo(-.4,-.23); g.lineTo(0,0); g.lineTo(.4,-.23); g.moveTo(0,0); g.lineTo(0,.46); break;
    case 'compass': g.moveTo(.44,0); g.arc(0,0,.44,0,6.283); g.moveTo(.22,-.22); g.lineTo(.06,.06); g.lineTo(-.22,.22); g.lineTo(-.06,-.06); g.closePath(); break;
    case 'tv': g.rect(-.44,-.24,.88,.58); g.moveTo(-.14,-.24); g.lineTo(-.28,-.44); g.moveTo(.14,-.24); g.lineTo(.28,-.44); g.moveTo(-.2,.46); g.lineTo(.2,.46); break;
    case 'feed': g.rect(-.4,-.4,.8,.8); g.moveTo(-.24,-.2); g.lineTo(.24,-.2); g.moveTo(-.24,0); g.lineTo(.24,0); g.moveTo(-.24,.2); g.lineTo(.08,.2); break;
    case 'gamepad': g.moveTo(-.3,-.2); g.lineTo(.3,-.2); g.quadraticCurveTo(.52,-.2,.46,.18); g.quadraticCurveTo(.4,.4,.24,.3); g.lineTo(.14,.14); g.lineTo(-.14,.14); g.lineTo(-.24,.3); g.quadraticCurveTo(-.4,.4,-.46,.18); g.quadraticCurveTo(-.52,-.2,-.3,-.2); g.closePath();
      g.moveTo(-.3,-.02); g.lineTo(-.1,-.02); g.moveTo(-.2,-.12); g.lineTo(-.2,.08); g.moveTo(.2,-.02); g.lineTo(.2001,-.02); g.moveTo(.32,.06); g.lineTo(.3201,.06); break;
    case 'bag': g.moveTo(-.34,-.18); g.lineTo(.34,-.18); g.lineTo(.42,.44); g.lineTo(-.42,.44); g.closePath(); g.moveTo(-.16,-.18); g.quadraticCurveTo(-.16,-.46,0,-.46); g.quadraticCurveTo(.16,-.46,.16,-.18); break;
    case 'city': g.moveTo(-.46,.42); g.lineTo(-.46,-.06); g.lineTo(-.2,-.06); g.lineTo(-.2,-.4); g.lineTo(.1,-.4); g.lineTo(.1,0); g.lineTo(.46,0); g.lineTo(.46,.42); g.closePath(); g.moveTo(-.06,-.24); g.lineTo(-.06,-.2); g.moveTo(-.06,-.06); g.lineTo(-.06,-.02); break;
    case 'planet': g.moveTo(.24,0); g.arc(0,0,.24,0,6.283); g.moveTo(.46,0); g.ellipse(0,0,.46,.14,-.45,0,6.283); g.moveTo(.36,-.36); g.lineTo(.3601,-.36); g.moveTo(-.38,.34); g.lineTo(-.3799,.34); break;
    case 'wave': g.moveTo(.34,-.22); g.arc(.2,-.22,.14,0,6.283); g.moveTo(-.46,.08); g.quadraticCurveTo(-.34,-.06,-.23,.08); g.quadraticCurveTo(-.12,.22,0,.08); g.quadraticCurveTo(.12,-.06,.23,.08); g.quadraticCurveTo(.34,.22,.46,.08);
      g.moveTo(-.46,.3); g.quadraticCurveTo(-.34,.16,-.23,.3); g.quadraticCurveTo(-.12,.44,0,.3); g.quadraticCurveTo(.12,.16,.23,.3); g.quadraticCurveTo(.34,.44,.46,.3); break;
    case 'circle': g.moveTo(.4,0); g.arc(0,0,.4,0,6.283); g.moveTo(.12,0); g.arc(0,0,.12,0,6.283); break;
    case 'person': g.moveTo(.16,-.18); g.arc(0,-.18,.16,0,6.283); g.moveTo(-.34,.44); g.quadraticCurveTo(-.34,.08,0,.08); g.quadraticCurveTo(.34,.08,.34,.44); break;
    case 'bell': g.moveTo(-.3,.24); g.quadraticCurveTo(-.2,.14,-.2,-.08); g.quadraticCurveTo(-.2,-.34,0,-.34); g.quadraticCurveTo(.2,-.34,.2,-.08); g.quadraticCurveTo(.2,.14,.3,.24); g.closePath(); g.moveTo(.08,.36); g.arc(0,.36,.08,0,Math.PI); break;
    case 'vr': g.rect(-.46,-.22,.92,.44); g.moveTo(-.1,0); g.arc(-.22,0,.12,0,6.283); g.moveTo(.34,0); g.arc(.22,0,.12,0,6.283); break;
    case 'wifi': g.arc(0,.3,.5,-2.4,-.74); g.moveTo(.0,.3); g.arc(0,.3,.33,-2.4,-.74); g.moveTo(0,.3); g.arc(0,.3,.16,-2.4,-.74); g.moveTo(0,.3); g.lineTo(.0001,.3); break;
    case 'back': g.moveTo(.16,-.36); g.lineTo(-.2,0); g.lineTo(.16,.36); break;
    case 'forward': g.moveTo(-.16,-.36); g.lineTo(.2,0); g.lineTo(-.16,.36); break;
    case 'up': g.moveTo(-.36,.16); g.lineTo(0,-.2); g.lineTo(.36,.16); break;
    case 'down': g.moveTo(-.36,-.16); g.lineTo(0,.2); g.lineTo(.36,-.16); break;
    case 'star': for(i=0;i<10;i++){ a=-Math.PI/2+i*Math.PI/5; var rad=(i%2===0)?.46:.2; if(i===0){ g.moveTo(Math.cos(a)*rad,Math.sin(a)*rad); } else { g.lineTo(Math.cos(a)*rad,Math.sin(a)*rad); } } g.closePath(); break;
    case 'search': g.moveTo(.22,-.1); g.arc(-.08,-.1,.3,0,6.283); g.moveTo(.14,.12); g.lineTo(.42,.4); break;
    case 'target': g.moveTo(.3,0); g.arc(0,0,.3,0,6.283); g.moveTo(.06,0); g.arc(0,0,.06,0,6.283); g.moveTo(0,-.46); g.lineTo(0,-.36); g.moveTo(0,.36); g.lineTo(0,.46); g.moveTo(-.46,0); g.lineTo(-.36,0); g.moveTo(.36,0); g.lineTo(.46,0); break;
    case 'grid': for(i=0;i<3;i++){ for(a=0;a<3;a++){ g.rect(-.4+i*.3,-.4+a*.3,.2,.2); } } break;
    case 'full': g.moveTo(-.4,-.15); g.lineTo(-.4,-.4); g.lineTo(-.15,-.4); g.moveTo(.15,-.4); g.lineTo(.4,-.4); g.lineTo(.4,-.15); g.moveTo(.4,.15); g.lineTo(.4,.4); g.lineTo(.15,.4); g.moveTo(-.15,.4); g.lineTo(-.4,.4); g.lineTo(-.4,.15); break;
    case 'close': g.moveTo(-.3,-.3); g.lineTo(.3,.3); g.moveTo(.3,-.3); g.lineTo(-.3,.3); break;
    case 'minus': g.moveTo(-.3,0); g.lineTo(.3,0); break;
    case 'plus': g.moveTo(-.3,0); g.lineTo(.3,0); g.moveTo(0,-.3); g.lineTo(0,.3); break;
    default: break;
  }
  g.stroke(); g.restore();
}

/* ============================ UI (canvas -> textura) ============================ */
var FONT='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
var UW=1024,UH=640,US=2, DW=800,DH=172, QW=520,QH=360;
function mkCanvas(w,h){ var c=document.createElement('canvas'); c.width=w*US; c.height=h*US; return c; }
var uiC=mkCanvas(UW,UH), ug=uiC.getContext('2d');
var apC=mkCanvas(UW,UH), ag=apC.getContext('2d');
var dkC=mkCanvas(DW,DH), dg=dkC.getContext('2d');
var qkC=mkCanvas(QW,QH), qg=qkC.getContext('2d');
function mkTex(c){
  var t=new THREE.CanvasTexture(c);
  try{ t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy()); }catch(e){}
  if(!renderer.capabilities.isWebGL2){ t.generateMipmaps=false; t.minFilter=THREE.LinearFilter; }
  return t;
}
var libTex=mkTex(uiC), appTex=mkTex(apC), dockTex=mkTex(dkC), quickTex=mkTex(qkC);
function mkPanel(tex,w,h,ro){
  var m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false}));

function favIndex(e){ if(!e) return -1; for(var i=0;i<B.store.fav.length;i++){ if(same(norm(B.store.fav[i]),e)) return i; } return -1; }
function pushRecent(e){ B.store.rec=[e].concat(B.store.rec.map(norm).filter(function(x){ return !same(x,e); })).slice(0,12); bSave(); }
function curEntry(){
  var c=B.cur;
  if(c.v==='article'&&c.title) return {v:'article',title:c.title};
  if(c.v==='page'&&c.url) return {v:'page',url:c.url,title:c.title||c.url};
  return null;
}

/* ---- utilidades ---- */
function wrapLines(g,text,font,maxW){
  g.font=font;
  var words=String(text).split(/\s+/), lines=[], cur='';
  for(var i=0;i<words.length;i++){
    var w=words[i]; if(!w) continue;
    var t=cur?cur+' '+w:w;
    if(g.measureText(t).width>maxW&&cur){ lines.push(cur); cur=w; } else { cur=t; }
  }
  if(cur) lines.push(cur);
  return lines.length?lines:[''];
}
function decodeEnt(s){
  return String(s).replace(/&#x([0-9a-f]+);/gi,function(m,h){ return String.fromCharCode(parseInt(h,16)); })
    .replace(/&#(\d+);/g,function(m,d){ return String.fromCharCode(parseInt(d,10)); })
    .replace(/&quot;/g,'"').replace(/&#039;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&');
}
function stripTags(s){ return decodeEnt(String(s).replace(/<[^>]*>/g,'')).replace(/\s+/g,' ').trim(); }
function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
function tfetch(url,ms){
  var ctl=new AbortController(), tm=setTimeout(function(){ ctl.abort(); },ms||12000);
  return fetch(url,{signal:ctl.signal}).then(function(r){ clearTimeout(tm); if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); });
}
function wfetch(params){
  var ctl=new AbortController(), tm=setTimeout(function(){ ctl.abort(); },12000);
  return fetch('https://pt.wikipedia.org/w/api.php?'+params+'&format=json&origin=*',{signal:ctl.signal}).then(function(r){
    clearTimeout(tm); if(!r.ok) throw new Error('HTTP '+r.status); return r.json();
  });
}
/* usa o primeiro provedor que responder com algo válido */
function firstOk(ps,valid){
  valid=valid||function(v){ return v&&v.length>0; };
  return new Promise(function(res,rej){
    var left=ps.length;
    ps.forEach(function(p){
      p.then(function(v){ if(valid(v)) res(v); else if(--left===0) rej(new Error('vazio')); })
       .catch(function(){ if(--left===0) rej(new Error('falhou')); });
    });
  });
}

/* ---- análise de resultados de busca (DuckDuckGo HTML) ---- */
function realUrl(h){
  h=decodeEnt(h||'');
  var m=h.match(/[?&]uddg=([^&]+)/);
  var u=m?decodeURIComponent(m[1]):h;
  if(u.indexOf('//')===0) u='https:'+u;
  return /^https?:\/\//i.test(u)?u:'';
}
function ddgParse(html){
  var titles=[], snips=[], m, re=/<a\b[^>]*>/gi;
  var reA=/<a\b([^>]*)>([\s\S]*?)<\/a>/gi;
  while((m=reA.exec(html))){
    var attrs=m[1];
    if(/class="[^"]*result__a[^"]*"/.test(attrs)){
      var hm=attrs.match(/href="([^"]+)"/); if(!hm) continue;
      titles.push({idx:m.index,url:realUrl(hm[1]),title:stripTags(m[2])});
    }else if(/class="[^"]*result__snippet[^"]*"/.test(attrs)){
      snips.push({idx:m.index,text:stripTags(m[2])});
    }
  }
  var reD=/<(?:div|td)\b[^>]*class="[^"]*result__snippet[^"]*"[^>]*>([\s\S]*?)<\/(?:div|td)>/gi;
  while((m=reD.exec(html))){ snips.push({idx:m.index,text:stripTags(m[1])}); }
  snips.sort(function(a,b){ return a.idx-b.idx; });
  var out=[], seen={};
  for(var i=0;i<titles.length;i++){
    var t=titles[i]; if(!t.url||!t.title||seen[t.url]) continue;
    if(/duckduckgo\.com\/y\.js|ad_provider|ad_domain/.test(t.url)) continue;
    var next=(i+1<titles.length)?titles[i+1].idx:Infinity, sn='';
    for(var j=0;j<snips.length;j++){ if(snips[j].idx>t.idx&&snips[j].idx<next){ sn=snips[j].text; break; } }
    seen[t.url]=1; out.push({title:t.title,url:t.url,snippet:sn});
  }
  return out;
}
function jinaSearchParse(md){
  var out=[], seen={}, m, re=/\[([^\]]+)\]\((https?:\/\/duckduckgo\.com\/l\/\?[^)\s]*uddg=[^)\s]+)\)/g;
  while((m=re.exec(md))){
    var u=realUrl(m[2]), t=m[1].replace(/\*+/g,'').trim();
    if(!u||seen[u]||/^https?:\/\//.test(t)) continue;
    seen[u]=1; out.push({title:t,url:u,snippet:''});
  }
  return out;
}
function webSearch(q){
  var u='https://html.duckduckgo.com/html/?q='+encodeURIComponent(q), enc=encodeURIComponent(u);
  return firstOk([
    tfetch('https://api.allorigins.win/raw?url='+enc,12000).then(ddgParse),
    tfetch('https://api.codetabs.com/v1/proxy/?quest='+enc,12000).then(ddgParse),
    tfetch('https://corsproxy.io/?url='+enc,12000).then(ddgParse),
    tfetch('https://r.jina.ai/'+u,15000).then(jinaSearchParse)
  ]);
}

/* ---- leitura de páginas (modo leitura: texto + links) ---- */
function jinaPage(txt,url){
  var title='', body=txt, mt=txt.match(/^Title:\s*(.*)$/m);
  if(mt) title=mt[1].trim();
  var ix=txt.indexOf('Markdown Content:'); if(ix>=0) body=txt.slice(ix+17);
  var links=[], seen={};
  body=body.replace(/!\[[^\]]*\]\([^)]*\)/g,'');
  body=body.replace(/\[([^\]]*)\]\((https?:\/\/[^)\s]+)(?:\s+"[^"]*")?\)/g,function(m,t,u){
    t=t.replace(/\s+/g,' ').trim();
    if(t&&t.length<=60&&!seen[u]){ seen[u]=1; links.push({text:t,url:u}); }
    return t;
  });
  body=body.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');
  var blocks=[];
  body.split('\n').forEach(function(l){
    l=l.trim(); if(!l||/^[-=*_]{3,}$/.test(l)||/^```/.test(l)) return;
    var h=l.match(/^(#{1,6})\s+(.*)$/);
    if(h){ var x=h[2].replace(/\*+/g,'').trim(); if(x) blocks.push({t:'h',x:x}); }
    else{ l=l.replace(/^[*+-]\s+/,'• ').replace(/\*\*|__/g,'').replace(/`/g,''); if(l.length>1) blocks.push({t:'p',x:l}); }
  });
  return {title:title||hostOf(url)||url,blocks:blocks,links:links};
}
function htmlPage(html,url){
  var tm=html.match(/<title[^>]*>([\s\S]*?)<\/title>/i), title=tm?stripTags(tm[1]):'';
  var clean=html.replace(/<(script|style|noscript|svg|nav|footer|header|form)\b[\s\S]*?<\/\1>/gi,'');
  var blocks=[], m, re=/<(h[1-3]|p|li)\b[^>]*>([\s\S]*?)<\/\1>/gi;
  while((m=re.exec(clean))){
    var x=stripTags(m[2]); if(!x) continue;
    if(m[1][0]==='h'){ blocks.push({t:'h',x:x}); } else if(x.length>25){ blocks.push({t:'p',x:(m[1]==='li'?'• ':'')+x}); }
  }
  var links=[], seen={}, la=/<a\b[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/gi;
  while((m=la.exec(clean))){
    var tx=stripTags(m[2]); if(!tx||tx.length>60) continue;
    var u=''; try{ u=new URL(decodeEnt(m[1]),url).href; }catch(e){ continue; }
    if(!/^https?:\/\//.test(u)||seen[u]) continue;
    seen[u]=1; links.push({text:tx,url:u});
  }
  return {title:title||hostOf(url)||url,blocks:blocks,links:links};
}
function loadPageData(url){
  var enc=encodeURIComponent(url);
  return firstOk([
    tfetch('https://r.jina.ai/'+url,20000).then(function(t){ return jinaPage(t,url); }),
    tfetch('https://api.allorigins.win/raw?url='+enc,20000).then(function(h){ return htmlPage(h,url); }),
    tfetch('https://corsproxy.io/?url='+enc,20000).then(function(h){ return htmlPage(h,url); })
  ],function(d){ return d&&d.blocks&&d.blocks.length>0; });
}

/* ---- construtores de página (layout em coordenadas do conteúdo) ---- */
function pg(){ return {items:[],y:0}; }
function pText(P,text,font,lh,color,x,maxW,gap){
  var L=wrapLines(ag,text,font,maxW||BW);
  P.items.push({k:'t',x:x||0,y:P.y,lines:L,font:font,lh:lh,color:color||'rgba(255,255,255,.9)'});
  P.y+=L.length*lh+(gap||0);
}
function pChips(P,labels,fn){
  var x=0,y=P.y,h=48; ag.font='500 24px '+FONT;
  labels.forEach(function(lb,i){
    var w=Math.min(BW,ag.measureText(lb).width+40);
    if(x+w>BW){ x=0; y+=h+12; }
    P.items.push({k:'c',x:x,y:y,w:w,h:h,label:lb,fn:function(){ fn(lb,i); }});
    x+=w+12;
  });
  P.y=y+h+16;
}
function pCards(P,titles,fn){
  var cw=282,ch=100,gx=17;
  titles.forEach(function(tt,n){
    var col=n%3,row=Math.floor(n/3);
    var L=wrapLines(ag,tt,'600 24px '+FONT,cw-32).slice(0,2);
    P.items.push({k:'k',x:col*(cw+gx),y:P.y+row*(ch+14),w:cw,h:ch,lines:L,fn:function(){ fn(tt); }});
  });
  P.y+=Math.ceil(titles.length/3)*(ch+14)+6;
}
function finish(P){ B.page=P; B.max=Math.max(0,P.y-BH+10); B.scroll=clamp(B.scroll,0,B.max); R.appDirty=true; }

function buildMessage(title,msg,label,fn){
  var P=pg(); pText(P,title,'700 34px '+FONT,44,'#fff',0,BW,6);
  pText(P,msg,'400 24px '+FONT,34,'rgba(255,255,255,.7)',0,BW,16);
  if(label) pChips(P,[label],fn);
  finish(P);
}
var QUICK=[['Wikipédia','https://pt.wikipedia.org'],['G1','https://g1.globo.com'],['BBC Brasil','https://www.bbc.com/portuguese'],['GitHub','https://github.com']];
function buildHome(){
  var P=pg();
  pText(P,'Pesquisar na web','700 36px '+FONT,46,'#fff',0,BW,4);
  pText(P,'Toque na barra de endereço, digite o que quer pesquisar ou um endereço de site e toque em Buscar.','400 22px '+FONT,30,'rgba(255,255,255,.6)',0,BW,18);
  var fav=B.store.fav.map(norm).slice(0,10), rec=B.store.rec.map(norm).slice(0,8);
  if(fav.length){ pText(P,'Favoritos','600 28px '+FONT,38,'#fff',0,BW,6); pChips(P,fav.map(labelOf),function(l,i){ navTo(fav[i]); }); }
  if(rec.length){ pText(P,'Recentes','600 28px '+FONT,38,'#fff',0,BW,6); pChips(P,rec.map(labelOf),function(l,i){ navTo(rec[i]); }); }
  pText(P,'Sites rápidos','600 28px '+FONT,38,'#fff',0,BW,6);
  pChips(P,QUICK.map(function(q){ return q[0]; }),function(l,i){ navTo(entryForUrl(QUICK[i][1],QUICK[i][0])); });
  pText(P,'Descobrir na Wikipédia','600 28px '+FONT,38,'#fff',0,BW,8);
  if(B.rand&&B.rand.length){ pCards(P,B.rand,function(t){ navTo({v:'article',title:t}); }); }
  else if(B.randErr){ pText(P,'Não foi possível carregar sugestões (sem conexão?).','400 22px '+FONT,30,'rgba(255,255,255,.6)',0,BW,10); pChips(P,['Tentar de novo'],function(){ loadRandom(); }); }
  else{ pText(P,'Carregando sugestões…','400 22px '+FONT,30,'rgba(255,255,255,.6)',0,BW,10); }
  finish(P);
}
function buildWeb(q,list,note){
  var P=pg();
  pText(P,'Resultados para “'+q+'”','600 30px '+FONT,40,'#fff',0,BW,6);
  if(note) pText(P,note,'400 22px '+FONT,30,'#fbbf24',0,BW,8);
  if(!list.length){ pText(P,'Nenhum resultado encontrado.','400 24px '+FONT,32,'rgba(255,255,255,.6)',0,BW,0); }
  list.forEach(function(r){
    var L=wrapLines(ag,r.snippet||'','400 22px '+FONT,BW-40).slice(0,2);
    var tl=wrapLines(ag,r.title||r.url,'600 27px '+FONT,BW-40)[0];
    P.items.push({k:'r',x:0,y:P.y,w:BW,h:132,title:tl,sub:hostOf(r.url),lines:L,fn:function(){ navTo(entryForUrl(r.url,r.title)); }});
    P.y+=144;
  });
  finish(P);
}
function buildPage(d,url){
  var P=pg();
  pText(P,d.title||url,'700 34px '+FONT,44,'#fff',0,BW,4);
  pText(P,url,'400 20px '+FONT,28,'#86efac',0,BW,10);
  pChips(P,['Abrir em nova aba'],function(){ openExternal(url); });
  var total=0;
  d.blocks.forEach(function(b){
    if(total>40000) return; total+=b.x.length;
    if(b.t==='h'){ P.y+=6; pText(P,b.x,'600 28px '+FONT,38,'#9cc4ff',0,BW,4); }
    else{ pText(P,b.x,'400 25px '+FONT,36,'rgba(255,255,255,.9)',0,BW,10); }
  });
  if(d.links.length){
    P.y+=8; pText(P,'Links desta página','600 28px '+FONT,38,'#9cc4ff',0,BW,8);
    var ls=d.links.slice(0,30);
    pChips(P,ls.map(function(l){ return l.text.length>30?l.text.slice(0,29)+'…':l.text; }),function(lb,i){ navTo(entryForUrl(ls[i].url,ls[i].text)); });
  }
  finish(P);
}
function buildArticle(d){
  var P=pg(), hasImg=!!d.thumb, tw=hasImg?BW-250:BW;
  var tl=wrapLines(ag,d.title,'700 38px '+FONT,tw);
  P.items.push({k:'t',x:0,y:0,lines:tl,font:'700 38px '+FONT,lh:46,color:'#fff'});
  var tH=tl.length*46;
  if(hasImg){ P.items.push({k:'i',x:BW-230,y:0,w:230,h:172}); tH=Math.max(tH,182); }
  P.y=tH+8;
  var parts=String(d.extract||'').slice(0,30000).split('\n');
  var stop=/^(Referências|Ligações externas|Notas|Bibliografia|Ver também|Notas e referências|Fontes)$/i;
  for(var i=0;i<parts.length;i++){
    var ln=parts[i].trim(); if(!ln) continue;
    var m=ln.match(/^(={2,6})\s*(.*?)\s*\1$/);
    if(m){
      if(stop.test(m[2])) break;
      P.y+=8; pText(P,m[2],(m[1].length===2?'600 30px ':'600 26px ')+FONT,40,'#9cc4ff',0,BW,6);
    }else{ pText(P,ln,'400 25px '+FONT,37,'rgba(255,255,255,.9)',0,BW,14); }
  }
  if(d.links&&d.links.length){ P.y+=8; pText(P,'Veja também','600 30px '+FONT,40,'#9cc4ff',0,BW,8); pChips(P,d.links.slice(0,24),function(t){ navTo({v:'article',title:t}); }); }
  finish(P);
}
function openExternal(url){
  if(!/^https?:\/\//i.test(url)) return;
  var w=null; try{ w=window.open(url,'_blank'); }catch(e){}
  if(w){ try{ w.opener=null; }catch(e){} } else { toast('Bloqueado: toque na tela sobre o botão'); }
}

/* ---- navegação ---- */
function parseUrl(q){
  var s=q.trim(); if(/\s/.test(s)) return null;
  var m=s.match(/^(https?:\/\/)?([a-z0-9-]+(\.[a-z0-9-]+)+)(:\d+)?(\/\S*)?$/i); if(!m) return null;
  var host=m[2].toLowerCase(), path=m[5]||'', url=(m[1]||'https://')+m[2]+(m[4]||'')+path;
  var wm=path.match(/^\/wiki\/([^?#]+)/);
  if((host==='pt.wikipedia.org'||host==='pt.m.wikipedia.org')&&wm){ try{ return {wiki:decodeURIComponent(wm[1]).replace(/_/g,' ')}; }catch(e){} }
  return {url:url};
}
function entryForUrl(url,title){
  var u=parseUrl(url);
  if(u&&u.wiki) return {v:'article',title:u.wiki};
  return {v:'page',url:(u&&u.url)||url,title:title||''};
}
function navTo(e){ B.stack=B.stack.slice(0,B.i+1); B.stack.push(e); B.i=B.stack.length-1; B.kb=false; loadEntry(e); }
function navBack(){ if(B.i>0){ B.i--; B.kb=false; loadEntry(B.stack[B.i]); } }
function navFwd(){ if(B.i<B.stack.length-1){ B.i++; B.kb=false; loadEntry(B.stack[B.i]); } }
function navHome(){ navTo({v:'home'}); }
function loadRandom(){
  B.randErr=false;
  wfetch('action=query&list=random&rnnamespace=0&rnlimit=6').then(function(d){
    B.rand=((d.query&&d.query.random)||[]).map(function(x){ return x.title; });
    if(B.cur.v==='home') buildHome();
  }).catch(function(){ B.randErr=true; B.rand=null; if(B.cur.v==='home') buildHome(); });
  if(B.cur.v==='home') buildHome();
}
function loadEntry(e){
  var tok=++B.req; B.cur=e; B.scroll=0; B.img=null; R.appDirty=true;
  if(e.v==='home'){ buildHome(); if(!B.rand) loadRandom(); return; }
  function fail(msg){ if(tok!==B.req) return; buildMessage('Sem conexão',msg||'Não foi possível carregar. Verifique a internet.','Tentar de novo',function(){ loadEntry(e); }); }

  if(e.v==='web'){
    var wk='w:'+e.q;
    if(B.cache[wk]){ buildWeb(e.q,B.cache[wk].list,B.cache[wk].note); return; }
    buildMessage('Pesquisando…','Buscando “'+e.q+'” na web');
    webSearch(e.q).then(function(list){
      if(tok!==B.req) return;
      B.cache[wk]={list:list,note:''}; buildWeb(e.q,list,'');
    }).catch(function(){
      return wfetch('action=query&list=search&srlimit=10&srsearch='+encodeURIComponent(e.q)).then(function(d){
        if(tok!==B.req) return;
        var list=((d.query&&d.query.search)||[]).map(function(r){
          return {title:r.title,url:'https://pt.wikipedia.org/wiki/'+encodeURIComponent(r.title.replace(/ /g,'_')),snippet:stripTags(r.snippet)+'…'};
        });
        buildWeb(e.q,list,'A busca na web está indisponível agora. Mostrando resultados da Wikipédia.');
      });
    }).catch(function(){ fail(); });
    return;
  }

  if(e.v==='page'){
    var pk='p:'+e.url;
    var showP=function(d){
      if(tok!==B.req) return;
      e.title=d.title||e.title||e.url; pushRecent({v:'page',url:e.url,title:e.title}); buildPage(d,e.url);
    };
    if(B.cache[pk]){ showP(B.cache[pk]); return; }
    buildMessage('Carregando…',e.url);
    loadPageData(e.url).then(function(d){ B.cache[pk]=d; showP(d); }).catch(function(){
      if(tok!==B.req) return;
      buildMessage('Não foi possível abrir','O site bloqueou a leitura, exige JavaScript ou está fora do ar.','Abrir em nova aba',function(){ openExternal(e.url); });
    });
    return;
  }

  /* artigo da Wikipédia */
  var key='a:'+e.title;
  buildMessage('Carregando…','Buscando conteúdo na Wikipédia');
  var apply=function(d){
    if(tok!==B.req) return;
    e.title=d.title; pushRecent({v:'article',title:d.title});
    if(d.thumb){
      var im=new Image(); im.crossOrigin='anonymous';
      im.onload=function(){ if(tok===B.req){ B.img=im; R.appDirty=true; } };
      im.onerror=function(){};
      im.src=d.thumb;
    }
    buildArticle(d);
  };
  if(B.cache[key]){ apply(B.cache[key]); return; }
  wfetch('action=query&prop=extracts%7Cpageimages%7Clinks&explaintext=1&exsectionformat=wiki&piprop=thumbnail&pithumbsize=400&pllimit=30&plnamespace=0&redirects=1&titles='+encodeURIComponent(e.title)).then(function(r){
    if(tok!==B.req) return;
    var pages=(r.query&&r.query.pages)||{}, id=Object.keys(pages)[0], pgd=pages[id];
    if(!pgd||pgd.missing!==undefined||id==='-1'){
      buildMessage('Artigo não encontrado','Não existe um artigo chamado “'+e.title+'”.','Buscar na web',function(){ navTo({v:'web',q:e.title}); });
      return;
    }
    var d={title:pgd.title,extract:pgd.extract||'',thumb:pgd.thumbnail&&pgd.thumbnail.source,links:(pgd.links||[]).map(function(l){ return l.title; })};
    B.cache[key]=d; apply(d);
  }).catch(function(){ fail(); });
}
function browserOpen(){
  B.kb=false; R.appDirty=true;
  if(!B.inited){ B.inited=true; loadEntry(B.stack[0]); }
}
function browserScroll(d){ B.scroll=clamp(B.scroll+d,0,B.max); R.appDirty=true; }
function bSubmit(){
  var q=B.q.trim(); B.kb=false; R.appDirty=true; if(!q) return;
  var u=parseUrl(q);
  if(u){ navTo(u.wiki?{v:'article',title:u.wiki}:{v:'page',url:u.url,title:''}); }
  else navTo({v:'web',q:q});
}
function kbPress(k){
  if(k==='bs'){ B.q=B.q.slice(0,-1); }
  else if(k==='sp'){ B.q+=' '; }
  else if(k==='go'){ bSubmit(); return; }
  else if(k==='close'){ B.kb=false; }
  else{ if(B.q.length<100) B.q+=k; }
  R.appDirty=true;
}
function toggleFav(){
  var ce=curEntry();
  if(!ce){ toast('Abra uma página para favoritar'); return; }
  var ix=favIndex(ce);
  if(ix>=0){ B.store.fav.splice(ix,1); toast('Removido dos favoritos'); }
  else{ B.store.fav.unshift(ce); toast('Adicionado aos favoritos'); }
  bSave(); R.appDirty=true;
}
function addrText(){
  if(B.kb) return B.q+'|';
  var c=B.cur;
  if(c.v==='web') return 'Pesquisa  ›  '+c.q;
  if(c.v==='article') return 'pt.wikipedia.org/wiki/'+String(c.title).replace(/ /g,'_');
  if(c.v==='page') return c.url;
  return 'Pesquisar ou digitar endereço';
}

function drawKeyboard(g,hits,hov,hit){
  var rows=[
    [['1',1],['2',1],['3',1],['4',1],['5',1],['6',1],['7',1],['8',1],['9',1],['0',1]],
    [['q',1],['w',1],['e',1],['r',1],['t',1],['y',1],['u',1],['i',1],['o',1],['p',1]],
    [['a',1],['s',1],['d',1],['f',1],['g',1],['h',1],['j',1],['k',1],['l',1],['ç',1]],
    [['z',1],['x',1],['c',1],['v',1],['b',1],['n',1],['m',1],['bs',3]],
    [['close',2.5],['.',1],['sp',4],['go',2.5]]
  ];
  var kx=40,kw=944,gap=8,ky=176,kh=76;
  rows.forEach(function(row,r){
    var U=0; row.forEach(function(k){ U+=k[1]; });
    var unit=(kw-gap*(row.length-1))/U, x=kx, y=ky+r*(kh+gap);
    row.forEach(function(k){
      var key=k[0], w=unit*k[1], id='kb-'+key;
      var special=(key==='go'), label=key;
      if(key==='bs') label='Apagar'; else if(key==='sp') label='espaço'; else if(key==='close') label='Fechar'; else if(key==='go') label='Buscar';
      rr(g,x,y,w,kh,14);
      g.fillStyle=special?(hov===id?'#60a5fa':'#3b82f6'):(hov===id?'rgba(255,255,255,.32)':'rgba(255,255,255,.14)'); g.fill();
      g.fillStyle='#fff'; g.textAlign='center'; g.textBaseline='middle';
      g.font=(key.length>1?'600 24px ':'600 34px ')+FONT;
      g.fillText(label,x+w/2,y+kh/2+1);
      (function(kk){ hit(x,y,w,kh,id,function(){ kbPress(kk); }); })(key);
      x+=w+gap;
    });
  });
}

/* ============================ LAYOUT 3D ============================ */
var fwd=new THREE.Vector3(0,0,-1), tmpV=new THREE.Vector3(), tmpV2=new THREE.Vector3();
var libBase=new THREE.Vector2(1.5,0.9375), dockBase=new THREE.Vector2(1.05,DH/DW*1.05), quickBase=new THREE.Vector2(0.55,0.55*QH/QW);
function layout(){
  var u=S.ui, ly=0.12, hx=R.head.x, hy=R.head.y, hz=R.head.z;
  libBase.set(1.5*u,0.9375*u);
  libMesh.position.set(hx+fwd.x*1.15,hy+ly,hz+fwd.z*1.15); libMesh.lookAt(hx,hy+ly,hz);
  var dy=ly-0.469*u-0.205*u;
  dockBase.set(1.05*u,(DH/DW)*1.05*u);
  dockMesh.position.set(hx+fwd.x,hy+dy,hz+fwd.z); dockMesh.lookAt(hx,hy+dy+0.4,hz);
  quickBase.set(0.55*u,0.55*u*QH/QW);
  var qy=dy+0.2*u+quickBase.y/2;
  quickMesh.position.set(hx+fwd.x*0.92,hy+qy,hz+fwd.z*0.92); quickMesh.lookAt(hx,hy+qy+0.15,hz);
  R.appTarget.copy(libMesh.position);
  tmpV.copy(libMesh.position).sub(R.head); tmpV.y=0; if(tmpV.lengthSq()>0) tmpV.normalize().multiplyScalar(-0.04);
  R.appTarget.add(tmpV);
  appMesh.quaternion.copy(libMesh.quaternion);
}
function recenter(){
  if(X.on){ tmpV.copy(X.dir); }
  else{ rig.updateMatrixWorld(true); camC.getWorldDirection(tmpV); }
  tmpV.y=0;
  if(tmpV.lengthSq()>0.01){ fwd.copy(tmpV.normalize()); }
  layout();
}

/* ============================ AJUSTES VISUAIS ============================ */
function applyQuality(){
  var pr=Math.min(window.devicePixelRatio||1,2)*[0.6,0.8,1,1.3][S.q-1]*(S.aa?1.25:1);
  renderer.setPixelRatio(Math.min(pr,3));
  resize();
}
function layoutBg(){
  var h=2*BG*Math.tan(THREE.MathUtils.degToRad(S.fov/2));
  FH=h; FW=h*eyeA;
  vidPlane.scale.set(FW*1.08,FH*1.08,1);
}
function updateVideoMap(){
  if(!vtex||!video.videoWidth) return;
  var va=video.videoWidth/video.videoHeight, rx=1, ry=1;
  if(va>eyeA){ rx=eyeA/va; } else { ry=va/eyeA; }
  vtex.repeat.set(rx,ry); vtex.offset.set((1-rx)/2,(1-ry)/2);
  MAP={rx:rx,ry:ry,ox:(1-rx)/2,oy:(1-ry)/2};
}
function resize(){
  if(X.on) return;
  VW=window.innerWidth; VH=window.innerHeight;
  renderer.setSize(VW,VH,false);
  eyeA=S.stereo?(VW/2)/VH:VW/VH;
  [camL,camR,camC].forEach(function(c){ c.fov=S.fov; c.aspect=eyeA; c.updateProjectionMatrix(); });
  camL.position.x=S.stereo?-S.ipd/2000:0; camR.position.x=S.ipd/2000;
  layoutBg(); updateVideoMap();
  $('rot').style.display=(R.started&&S.stereo&&VH>VW)?'flex':'none';
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,250); });
video.addEventListener('resize',updateVideoMap);

function effEnv(){ return (X.on&&S.env==='passthrough')?(X.mode==='ar'?'passthrough':'space'):S.env; }
function applyVisual(){
  var env=effEnv();
  sky.visible=env!=='passthrough';
  if(sky.visible){
    if(!skyCache[env]) skyCache[env]=mkSky(env);
    sky.material.map=skyCache[env]; sky.material.needsUpdate=true;
  }
  vidPlane.visible=videoReady&&S.camOn&&!X.on;
  vidMat.opacity=S.camOpa/100;
  vidMat.color.setScalar(S.camBri/100);
}
function setEnv(id){
  S.env=id;
  if(id==='passthrough'){ S.camOn=true; S.camOpa=100; if(R.camFail) toast('Câmera indisponível'); } else { S.camOn=false; }
  applyVisual(); chg();
}

/* ============================ BOLHAS ============================ */
var bubbles=[], bubGeo=new THREE.SphereGeometry(1,24,16), hiGeo=new THREE.SphereGeometry(0.16,10,8);
function spawn(b){
  var th=Math.random()*6.283, r=1.5+Math.random()*1.8;
  b.userData.base.set(Math.cos(th)*r,-0.6+Math.random()*2.1,Math.sin(th)*r);
  b.userData.pop=0; b.userData.rad=0.09+Math.random()*0.13; b.userData.ph=Math.random()*6.283;
  b.scale.setScalar(b.userData.rad); b.material.opacity=0.34;
}
function rebuildBubbles(){
  bubbles.forEach(function(b){ scene.remove(b); b.material.dispose(); });
  bubbles=[];
  for(var i=0;i<S.nb;i++){
    var m=new THREE.Mesh(bubGeo,new THREE.MeshBasicMaterial({color:BCOLS[S.bcol],transparent:true,opacity:0.34,depthWrite:false}));
    m.userData={base:new THREE.Vector3(),pop:0,rad:.1,ph:0,bubble:true};
    var hi=new THREE.Mesh(hiGeo,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.7,depthWrite:false})); hi.position.set(-0.4,0.45,0.55); m.add(hi);
    m.renderOrder=3; spawn(m); m.visible=S.bubbles; scene.add(m); bubbles.push(m);
  }
}

function OneEuro(minC,beta){ this.minC=minC; this.beta=beta; this.x=null; this.dx=0; }
OneEuro.prototype.f=function(v,dt){
  if(this.x===null){ this.x=v; this.dx=0; return v; }
  function al(c){ var tau=1/(6.283185*c); return 1/(1+tau/dt); }
  var d=(v-this.x)/dt; this.dx+=(d-this.dx)*al(1.0);
  var c=this.minC+this.beta*Math.abs(this.dx);
  this.x+=(v-this.x)*al(c); return this.x;
};

}

function lmToNdc(x,y){ var su=(x-MAP.ox)/MAP.rx, sv=((1-y)-MAP.oy)/MAP.ry; return {x:su*2-1,y:sv*2-1}; }
function onHands(res){
  try{
    var lms=res.multiHandLandmarks||[], hds=res.multiHandedness||[];
    var now=performance.now(), vw=video.videoWidth||1, vh=video.videoHeight||1, n, i;
    var dets=[];
    for(n=0;n<lms.length;n++){
      var l0=lms[n];
      dets.push({lm:l0,score:(hds[n]&&hds[n].score)||0,wx:l0[0].x*vw,wy:l0[0].y*vh,cx:l0[9].x*vw,cy:l0[9].y*vh,
        palm:Math.hypot((l0[0].x-l0[9].x)*vw,(l0[0].y-l0[9].y)*vh)||1});
    }
    /* remove detecções duplicadas da mesma mão (fantasma) */
    dets.sort(function(a,b){ return b.score-a.score; });
    var uniq=[];
    dets.forEach(function(d){
      var dup=uniq.some(function(u){ return Math.hypot(u.cx-d.cx,u.cy-d.cy)<Math.max(u.palm,d.palm)*1.1; });
      if(!dup) uniq.push(d);
    });
    uniq=uniq.slice(0,S.maxHands);
    /* cada detecção vai para o slot cuja mão estava mais perto (não depende de esquerda/direita) */
    var pairs=[], slotUsed=[false,false], detSlot=[];
    uniq.forEach(function(d,di){
      for(var si=0;si<S.maxHands;si++){ var hh=HS[si]; if(hh.lastW&&now-hh.lastSeen<500){ pairs.push({di:di,si:si,d:Math.hypot(hh.lastW.x-d.wx,hh.lastW.y-d.wy)}); } }
    });
    pairs.sort(function(a,b){ return a.d-b.d; });
    pairs.forEach(function(p){ if(detSlot[p.di]===undefined&&!slotUsed[p.si]&&p.d<vw*0.45){ detSlot[p.di]=p.si; slotUsed[p.si]=true; } });
    uniq.forEach(function(d,di){
      if(detSlot[di]!==undefined) return;
      var sl=-1;
      for(var si=0;si<S.maxHands;si++){ if(!slotUsed[si]&&(sl<0||HS[si].lastSeen<HS[sl].lastSeen)) sl=si; }
      if(sl>=0){ detSlot[di]=sl; slotUsed[sl]=true; }
    });
    for(i=0;i<2;i++){ if(!slotUsed[i]) HS[i].cnt=0; }
    uniq.forEach(function(d,di){
      var si=detSlot[di]; if(si===undefined) return;
      var h=HS[si], lm=d.lm;
      h.lastSeen=now; h.lastW={x:d.wx,y:d.wy}; h.cnt++; if(h.cnt>=3) h.conf=true;   /* só confirma após 3 quadros seguidos */
      var nd=lmToNdc((lm[4].x+lm[8].x)/2,(lm[4].y+lm[8].y)/2); h.raw.set(nd.x,nd.y);
      var dx=(lm[4].x-lm[8].x)*vw, dy=(lm[4].y-lm[8].y)*vh, dz=(lm[4].z-lm[8].z)*vw;
      var dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
      h.palm=d.palm/vh;
      var ratio=dist/d.palm, onT=0.20+0.035*S.sens, offT=onT+0.15;
      if(!h.pinch){ if(ratio<onT){ h.onC++; if(h.onC>=2){ h.pinch=true; h.onC=0; } } else { h.onC=0; } h.offC=0; }
      else{ if(ratio>offT){ h.offC++; if(h.offC>=2){ h.pinch=false; h.offC=0; } } else { h.offC=0; } h.onC=0; }
      var hx=FW/2, hy=FH/2, sk=h.sk;
      for(i=0;i<21;i++){ var p=lmToNdc(lm[i].x,lm[i].y); sk.pos[i*3]=p.x*hx; sk.pos[i*3+1]=p.y*hy; sk.pos[i*3+2]=0; }
      for(i=0;i<HAND_CONN.length;i++){
        var a=HAND_CONN[i][0], b=HAND_CONN[i][1];
        sk.line[i*6]=sk.pos[a*3]; sk.line[i*6+1]=sk.pos[a*3+1]; sk.line[i*6+2]=0;
        sk.line[i*6+3]=sk.pos[b*3]; sk.line[i*6+4]=sk.pos[b*3+1]; sk.line[i*6+5]=0;
      }
      sk.pg.attributes.position.needsUpdate=true; sk.lg.attributes.position.needsUpdate=true;
    });
  }catch(e){ showErr(e); }
}

async function startCamera(){
  var base={width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}};
  var stream=await navigator.mediaDevices.getUserMedia({video:Object.assign({facingMode:{ideal:'environment'}},base),audio:false});
  try{
    var devs=await navigator.mediaDevices.enumerateDevices();
    var ultra=devs.filter(function(d){ return d.kind==='videoinput'&&/ultra/i.test(d.label)&&!/front|frontal|user/i.test(d.label); })[0];
    var cur=stream.getVideoTracks()[0].getSettings().deviceId;
    if(ultra&&ultra.deviceId!==cur){
      var s2=await navigator.mediaDevices.getUserMedia({video:Object.assign({deviceId:{exact:ultra.deviceId}},base),audio:false});
      stream.getTracks().forEach(function(t){ t.stop(); }); stream=s2;
    }else{
      var tr=stream.getVideoTracks()[0], cap=tr.getCapabilities?tr.getCapabilities():null;
      if(cap&&cap.zoom&&cap.zoom.min<1){ await tr.applyConstraints({advanced:[{zoom:cap.zoom.min}]}); }
    }
  }catch(e){}
  video.srcObject=stream; await video.play();
  vtex=new THREE.VideoTexture(video); vtex.minFilter=THREE.LinearFilter; vtex.magFilter=THREE.LinearFilter; vtex.generateMipmaps=false;
  vidMat.map=vtex; vidMat.needsUpdate=true; videoReady=true;
  updateVideoMap(); applyVisual();
}

var ray=new THREE.Raycaster(), gazePick=null, primaryPick=null;

function pickR(o,d){ ray.set(o,d); return pickCore(); }
function pickCore(){
  if(!R.placed) return {kind:'none',point:ray.ray.at(1.6,new THREE.Vector3())};
  var objs=[dockMesh];
  if(R.quickOpen&&R.quickP>0.92) objs.push(quickMesh);
  if(R.libOpen&&R.libP>0.92&&R.appP<0.05) objs.push(libMesh);
  if(R.app&&R.appP>0.92&&R.appDir>0) objs.push(appMesh);
  if(S.cube&&cube.visible) objs.push(cube);
  if(S.bubbles) for(var i=0;i<bubbles.length;i++) objs.push(bubbles[i]);
  var hh=ray.intersectObjects(objs,false);
  if(hh.length){
    var o=hh[0].object;
    if(o===cube) return {kind:'cube',point:hh[0].point};
    if(o.userData&&o.userData.bubble) return {kind:'bubble',b:o,point:hh[0].point};
    if(hh[0].uv){
      var u=hh[0].uv.x*o.userData.w, v=(1-hh[0].uv.y)*o.userData.h, list=o.userData.hits;
      for(var k=list.length-1;k>=0;k--){ var e=list[k]; if(u>=e.x&&u<=e.x+e.w&&v>=e.y&&v<=e.y+e.h) return {kind:'ui',e:e,point:hh[0].point}; }
      return {kind:'ui',e:null,point:hh[0].point};
    }
  }
  return {kind:'none',point:ray.ray.at(1.6,new THREE.Vector3())};
}

/* Lógica de agarrar / mover / redimensionar o cubo */
function cubeGrabStart(h){
  if(h.mode==='xr'){
    C.size0=C.size; C.grab=h.i; C.resize=-1;
    if(h.screen){ C.dist0=cube.position.distanceTo(h.rayO); tmpV.copy(h.rayD).multiplyScalar(C.dist0).add(h.rayO); C.offXR.copy(cube.position).sub(tmpV); }
    else{ C.offXR.copy(cube.position).sub(h.pp); }
    if(R.section===5) R.libDirty=true; return;
  }
  ray.setFromCamera(h.lock,camC);
  var d0=cube.position.distanceTo(ray.ray.origin);
  C.dist0=d0; C.palm0=h.palmS; C.size0=C.size; C.grab=h.i; C.resize=-1;
  tmpV.copy(ray.ray.direction).multiplyScalar(d0).add(ray.ray.origin);
  C.off.copy(cube.position).sub(tmpV);
  if(R.section===5) R.libDirty=true;
}
function cubeUpdate(dt){
  if(C.grab>=0){
    var h=HS[C.grab];
    if(!h.active||!h.pinch){
      S.cubeSize=clamp(Math.round(C.size*100),4,60); save();
      C.grab=-1; C.resize=-1; if(R.section===5) R.libDirty=true;
    }else if(h.mode==='xr'){
      if(h.screen){ tmpV2.copy(h.rayD).multiplyScalar(C.dist0).add(h.rayO).add(C.offXR); } else { tmpV2.copy(h.pp).add(C.offXR); }
      cube.position.lerp(tmpV2,0.5);
      var sT=C.size0;
      if(C.resize>=0){
        var o3=HS[C.resize];
        if(o3.active&&o3.pinch&&o3.mode==='xr'){ sT=clamp(C.size0r*h.pp.distanceTo(o3.pp)/Math.max(C.hd0,0.02),0.03,1.2); }
        else{ C.resize=-1; }
      }
      C.size+=(sT-C.size)*0.35; cube.scale.setScalar(C.size);
    }else{
      ray.setFromCamera(h.cur,camC);
      var ratio=h.palmS/Math.max(C.palm0,0.01), d=C.dist0, sizeT=C.size0;
      if(S.cubeOne){ sizeT=clamp(C.size0*ratio,0.03,1.2); } else { d=clamp(C.dist0/clamp(ratio,0.4,2.5),0.3,4); }
      if(C.resize>=0){
        var o=HS[C.resize];
        if(o.active&&o.pinch){
          var dx=(h.cur.x-o.cur.x)*eyeA, dy=h.cur.y-o.cur.y, hd=Math.sqrt(dx*dx+dy*dy);
          sizeT=clamp(C.size0r*hd/Math.max(C.hd0,0.05),0.03,1.2);
        }else{ C.resize=-1; }
      }
      tmpV2.copy(ray.ray.direction).multiplyScalar(d).add(ray.ray.origin).add(C.off);
      cube.position.lerp(tmpV2,0.4);
      C.size+=(sizeT-C.size)*0.35; cube.scale.setScalar(C.size);
    }
  }
  if(C.grab<0) cube.rotation.y+=dt*0.5;
}

/* ============================ LOOP ============================ */
var lastMin=-1, lastNow=0;
function frame(now){
  requestAnimationFrame(frame);
  if(X.on) return;
  tick(now,null);
}
function xrFrame(now,xf){ if(!xf||!X.on) return; tick(now,xf); }
function tick(now,xf){
  if(!R.started) return;
  try{
    var dt=clamp((now-(lastNow||now))/1000,0.001,0.1); lastNow=now;
    if(xf){
      /* 6DOF: pose real da cabeça (posição + rotação) a cada quadro */
      var vp=xf.getViewerPose(X.ref);
      if(vp){
        var vt=vp.transform.position, vo=vp.transform.orientation;
        R.head.set(vt.x,vt.y,vt.z); X.headQ.set(vo.x,vo.y,vo.z,vo.w); fwdFromQ(vo,X.dir); X.hasPose=true;
      }
      sky.position.copy(R.head);
      if(!R.placed&&X.hasPose){ R.org.copy(R.head); recenter(); resetCube(); R.placed=true; R.libDirty=true; R.dockDirty=true; }
    }else{
      if(!R.placed&&(gotOri||now-R.startT>1500)){
        rig.quaternion.copy(targetQ); rig.updateMatrixWorld(true);
        recenter(); resetCube(); R.placed=true; R.libDirty=true; R.dockDirty=true;
      }
      var ang=rig.quaternion.angleTo(targetQ);
      rig.quaternion.slerp(targetQ,clamp(0.08+ang*1.8,0.08,0.6));   /* anti-tremor adaptativo */
    }

    /* animações: abrir/fechar menu, dock e aplicativos */
    if(R.placed){
      R.libP=clamp(R.libP+dt/0.30*(R.libOpen?1:-1),0,1);
      R.dockP=clamp(R.dockP+dt/0.45,0,1);
      if(!R.libOpen&&R.app) R.appDir=-1;
      if(R.app){
        R.appP=clamp(R.appP+dt/0.40*(R.appDir>0?1:-1),0,1);
        if(R.appDir<0&&R.appP<=0){ R.app=null; appMesh.visible=false; R.libDirty=true; }
      }
      var le=ease3(R.libP), lf=0.8+0.2*le;
      libMesh.scale.set(libBase.x*lf,libBase.y*lf,1);
      libMesh.material.opacity=clamp(R.libP*1.5,0,1)*(1-0.65*ease3(R.appP));
      libMesh.visible=R.libP>0.01;
      var de=ease3(R.dockP), df=0.85+0.15*de;
      dockMesh.scale.set(dockBase.x*df,dockBase.y*df,1); dockMesh.material.opacity=clamp(R.dockP*1.5,0,1); dockMesh.visible=true;
      if(R.app){
        var p2=smooth(R.appP);
        appMesh.position.lerpVectors(R.appOrigin,R.appTarget,p2);
        appMesh.scale.set(libBase.x*(216/UW)+(libBase.x-libBase.x*(216/UW))*p2,libBase.y*(150/UH)+(libBase.y-libBase.y*(150/UH))*p2,1);
        appMesh.quaternion.copy(libMesh.quaternion);
        appMesh.material.opacity=clamp(R.appP*2.2,0,1); appMesh.visible=true;
        if(R.appDir>0&&(!R.app.fin||R.appDirty)&&now-apLast>45){ drawApp(now); apLast=now; R.appDirty=false; }
      }
      R.quickP=clamp(R.quickP+dt/0.25*(R.quickOpen?1:-1),0,1);
      var qe=ease3(R.quickP), qf=0.85+0.15*qe;
      quickMesh.scale.set(quickBase.x*qf,quickBase.y*qf,1); quickMesh.material.opacity=clamp(R.quickP*1.6,0,1); quickMesh.visible=R.quickP>0.01;
      cube.visible=S.cube;
    }
    updateBubbles(now);
    scene.updateMatrixWorld(true);

    var d=new Date(), mn=d.getHours()*60+d.getMinutes();
    if(mn!==lastMin){ lastMin=mn; R.clock=d.getHours()+':'+('0'+d.getMinutes()).slice(-2); R.dockDirty=true; }
    if(R.toast){
      if(now>R.toastUntil){ R.toast=''; R.dockDirty=true; }
      else if(now-R.toastStart<200||R.toastUntil-now<260){ R.dockDirty=true; }
    }

    /* ---- mãos ---- */
    var nAct=0, hi, h;
    if(xf){ nAct=xrHandsUpdate(xf,now); }
    else for(hi=0;hi<2;hi++){
      h=HS[hi];
      if(now-h.lastSeen>=350){ h.conf=false; h.cnt=0; }
      var act=S.hands&&h.conf&&(hi===0||S.maxHands>1);
      if(act!==h.active){
        h.active=act; h.fx.x=null; h.fy.x=null; h.hist.length=0;
        if(act){ h.palmS=h.palm; } else { h.pinch=false; h.pinchPrev=false; }
      }
      if(act){
        nAct++;
        h.cur.set(h.fx.f(h.raw.x,dt),h.fy.f(h.raw.y,dt));
        h.palmS+=(h.palm-h.palmS)*0.25;
        h.hist.push({t:now,x:h.cur.x,y:h.cur.y});
        while(h.hist.length>2&&now-h.hist[0].t>500) h.hist.shift();
      }
      h.sk.group.visible=S.skel&&act&&videoReady&&S.camOn;
      var col=h.pinch?0x4ade80:0x7dd3fc; h.sk.pts.material.color.set(col); h.sk.lin.material.color.set(col);
    }
    if(nAct!==R.handN){ R.handN=nAct; if(R.section===4) R.libDirty=true; }

    for(hi=0;hi<2;hi++){
      h=HS[hi]; if(!h.active) continue;
      if(h.pinch&&!h.pinchPrev){
        var pkL;
        if(h.mode==='xr'){ pkL=h.pk||{kind:'none'}; }
        else{
          var ref=h.hist[0];
          for(var q=0;q<h.hist.length;q++){ if(now-h.hist[q].t<=140){ ref=h.hist[Math.max(0,q-1)]; break; } }
          if(ref) h.lock.set(ref.x,ref.y); else h.lock.copy(h.cur);
          pkL=pick(h.lock);
        }
        var nearCube=(h.mode==='xr'&&!h.screen&&S.cube&&cube.visible&&h.pp.distanceTo(cube.position)<Math.max(0.06,C.size*0.9));
        if(pkL.kind==='ui'&&pkL.e&&pkL.e.drag){
          R.drag={i:hi,e:pkL.e,y:h.cur.y};
        }else if(C.grab>=0&&C.grab!==hi&&S.cube){
          var o2=HS[C.grab];
          C.resize=hi; C.size0r=C.size;
          if(h.mode==='xr'&&o2.mode==='xr'){ C.hd0=h.pp.distanceTo(o2.pp); }
          else{ var ddx=(o2.cur.x-h.cur.x)*eyeA, ddy=o2.cur.y-h.cur.y; C.hd0=Math.sqrt(ddx*ddx+ddy*ddy); }
        }else if((pkL.kind==='cube'||nearCube)&&S.cube&&C.grab<0){
          cubeGrabStart(h);
        }else if(now-R.lastClick>300){
          R.lastClick=now; doClick(pkL);
        }
      }
      h.pinchPrev=h.pinch;
    }
    if(R.drag){ var dh=HS[R.drag.i]; if(dh.active&&dh.pinch){ var dgy=dh.cur.y-R.drag.y; R.drag.y=dh.cur.y; R.drag.e.drag(dgy); } else { R.drag=null; } }
    if(R.section===4){ var pp=(HS[0].pinch||HS[1].pinch); if(pp!==R.lastPinchShown){ R.lastPinchShown=pp; R.libDirty=true; } }
    cubeUpdate(dt);

    /* picks e cursores */
    var primary=null;
    for(hi=0;hi<2;hi++){ h=HS[hi]; if(h.active){ h.pk=(h.mode==='xr')?pickR(h.rayO,h.rayD):pick(h.cur); if(!primary) primary=h; } else { h.pk=null; cursors[hi].g.visible=false; } }
    if(!primary){ gazePick=xf?pickR(R.head,X.dir):pick({x:0,y:0}); primaryPick=gazePick; }
    else{ primaryPick=primary.pk; }
    var hid=(primaryPick.kind==='ui'&&primaryPick.e)?primaryPick.e.id:null;
    R.hoverChanged=false;
    if(hid!==R.hover){ R.hover=hid; R.hoverChanged=true; R.libDirty=true; R.dockDirty=true; R.quickDirty=true; }
    var cubeHover=false;
    for(hi=0;hi<2;hi++){ h=HS[hi]; if(h.active&&h.pk){ placeCursor(cursors[hi],h.pk,h.pinch,0xffffff); if(h.pk.kind==='cube') cubeHover=true; } }
    if(!primary){ placeCursor(cursors[0],gazePick,false,0xbfdbfe); if(gazePick.kind==='cube') cubeHover=true; }
    cubeMat.color.set(C.grab>=0?0x22c55e:(cubeHover?0x60a5fa:0x3b82f6));

    if(R.libDirty&&R.libP>0.01){ drawLib(); R.libDirty=false; }
    if(R.dockDirty&&R.placed){ drawDock(); R.dockDirty=false; }
    if(R.quickDirty&&R.quickP>0.01){ drawQuick(); R.quickDirty=false; }
    if(R.app&&R.hoverChanged){ R.appDirty=true; }

    if(xf){ renderer.setScissorTest(false); renderer.render(scene,camL); return; }
    var W=VW, Hh=VH;
    renderer.setScissorTest(true);
    if(S.stereo){
      renderer.setViewport(0,0,W/2,Hh); renderer.setScissor(0,0,W/2,Hh); renderer.render(scene,camL);
      renderer.setViewport(W/2,0,W/2,Hh); renderer.setScissor(W/2,0,W/2,Hh); renderer.render(scene,camR);
    }else{
      renderer.setViewport(0,0,W,Hh); renderer.setScissor(0,0,W,Hh); renderer.render(scene,camL);
    }
  }catch(e){ showErr(e); }
}
requestAnimationFrame(frame);


/* ============================ WEBXR (6DOF) ============================ */
var HAND_JOINTS=['wrist','thumb-metacarpal','thumb-phalanx-proximal','thumb-phalanx-distal','thumb-tip','index-finger-metacarpal','index-finger-phalanx-proximal','index-finger-phalanx-intermediate','index-finger-phalanx-distal','index-finger-tip','middle-finger-metacarpal','middle-finger-phalanx-proximal','middle-finger-phalanx-intermediate','middle-finger-phalanx-distal','middle-finger-tip','ring-finger-metacarpal','ring-finger-phalanx-proximal','ring-finger-phalanx-intermediate','ring-finger-phalanx-distal','ring-finger-tip','pinky-finger-metacarpal','pinky-finger-phalanx-proximal','pinky-finger-phalanx-intermediate','pinky-finger-phalanx-distal','pinky-finger-tip'];
function mkXrSk(){
  var pos=new Float32Array(25*3), g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var pts=new THREE.Points(g,new THREE.PointsMaterial({color:0x7dd3fc,size:8,sizeAttenuation:false,depthTest:false,transparent:true}));
  pts.frustumCulled=false; pts.renderOrder=40; pts.visible=false; scene.add(pts);
  return {pts:pts,pos:pos,g:g};
}
var XRSK=[mkXrSk(),mkXrSk()];
/* AR com tela dividida: o navegador entrega 1 vista; aqui ela vira 2 (metades da tela, deslocadas pela distância das lentes) */
var xrGetCamOrig=renderer.xr.getCamera?renderer.xr.getCamera.bind(renderer.xr):null, splitCams=null;
if(xrGetCamOrig){
  renderer.xr.getCamera=function(c){
    var vr=xrGetCamOrig(c);
    try{
      if(X.on&&X.split&&vr&&vr.cameras&&vr.cameras.length===1){
        if(!splitCams){ splitCams=[new THREE.PerspectiveCamera(),new THREE.PerspectiveCamera()]; splitCams.forEach(function(k){ k.viewport=new THREE.Vector4(); }); }
        var c0=vr.cameras[0], v=c0.viewport, half=v.width/2, off=S.ipd/2000;
        for(var k=0;k<2;k++){
          var cam=splitCams[k], sg=(k===0)?-1:1;
          cam.matrixWorld.copy(c0.matrixWorld);
          var e=cam.matrixWorld.elements; e[12]+=sg*off*e[0]; e[13]+=sg*off*e[1]; e[14]+=sg*off*e[2];
          cam.matrixWorldInverse.copy(cam.matrixWorld).invert();
          cam.projectionMatrix.copy(c0.projectionMatrix);
          cam.projectionMatrix.elements[0]*=2; cam.projectionMatrix.elements[8]*=2;
          cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();
          cam.viewport.set(v.x+k*half,v.y,half,v.height);
        }
        vr.cameras.length=0; vr.cameras.push(splitCams[0],splitCams[1]);
      }
    }catch(e){ X.split=false; try{ toast('Tela dividida indisponível'); }catch(e2){} }
    return vr;
  };
}
function onSelStart(ev){ var si=(ev.inputSource&&ev.inputSource.handedness==='left')?1:0; X.sel[si]=true; X.saw[si]=false; }
/* toque rápido na tela (AR) que termina entre dois quadros: clica direto no evento */
function onSelect(ev){
  try{
    var src=ev.inputSource, si=(src&&src.handedness==='left')?1:0;
    if(!src||src.targetRayMode!=='screen'||X.saw[si]||!ev.frame||!R.placed) return;
    var rp=ev.frame.getPose(src.targetRaySpace,X.ref); if(!rp) return;
    var pp=rp.transform.position, o=new THREE.Vector3(pp.x,pp.y,pp.z), d=new THREE.Vector3();
    fwdFromQ(rp.transform.orientation,d);
    if(X.split){ o.copy(R.head); d.copy(X.dir); }
    doClick(pickR(o,d));
  }catch(e){ showErr(e); }
}
function onSelEnd(ev){ X.sel[(ev.inputSource&&ev.inputSource.handedness==='left')?1:0]=false; }

/* mãos / controles do WebXR: raio de apontar + ponto de pinça em 3D real */
function xrHandsUpdate(xf,now){
  var seen=[false,false], srcs=X.session?X.session.inputSources:[], n=0, i;
  for(i=0;i<srcs.length;i++){
    var src=srcs[i];
    if(src.hand&&!S.hands) continue;
    var si=(src.handedness==='left')?1:0;
    if(seen[si]) si=1-si;
    if(seen[si]) continue;
    var rp=src.targetRaySpace?xf.getPose(src.targetRaySpace,X.ref):null;
    if(!rp) continue;
    seen[si]=true;
    var h=HS[si], p=rp.transform.position, pinchNow=false, haveHand=false, sk=XRSK[si];
    h.mode='xr'; h.lastSeen=now; h.screen=(src.targetRayMode==='screen');
    h.rayO.set(p.x,p.y,p.z); fwdFromQ(rp.transform.orientation,h.rayD);
    if(h.screen&&X.split){ h.rayO.copy(R.head); h.rayD.copy(X.dir); }   /* tela dividida: o toque clica onde você olha */
    if(src.hand){
      var tt=src.hand.get('thumb-tip'), it=src.hand.get('index-finger-tip');
      var tp=tt?xf.getJointPose(tt,X.ref):null, ip=it?xf.getJointPose(it,X.ref):null;
      if(tp&&ip){
        var a=tp.transform.position, b=ip.transform.position;
        h.pp.set((a.x+b.x)/2,(a.y+b.y)/2,(a.z+b.z)/2);
        var d=Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y)+(a.z-b.z)*(a.z-b.z));
        var onT=0.012+0.004*S.sens, offT=onT+0.015;
        pinchNow=h.pinch?(d<offT):(d<onT); haveHand=true;
      }
      for(var j=0;j<HAND_JOINTS.length;j++){
        var jt=src.hand.get(HAND_JOINTS[j]), jp=jt?xf.getJointPose(jt,X.ref):null;
        if(jp){ sk.pos[j*3]=jp.transform.position.x; sk.pos[j*3+1]=jp.transform.position.y; sk.pos[j*3+2]=jp.transform.position.z; }
      }
      sk.g.attributes.position.needsUpdate=true;
    }
    if(!haveHand){
      var gp=src.gripSpace?xf.getPose(src.gripSpace,X.ref):null;
      if(gp){ h.pp.set(gp.transform.position.x,gp.transform.position.y,gp.transform.position.z); } else { h.pp.copy(h.rayO); }
      pinchNow=!!X.sel[si];
    }
    sk.pts.visible=S.skel&&haveHand;
    sk.pts.material.color.set(pinchNow?0x4ade80:0x7dd3fc);
    if(pinchNow) X.saw[si]=true;
    h.pinch=pinchNow; h.cur.set(0,h.screen?h.rayD.y*2:h.pp.y*3);      /* cur.y alimenta o arrastar para rolar */
    h.pk=pickR(h.rayO,h.rayD);
  }
  for(i=0;i<2;i++){
    var hh=HS[i], act=seen[i];
    if(act!==hh.active){ hh.active=act; hh.hist.length=0; if(!act){ hh.pinch=false; hh.pinchPrev=false; hh.pk=null; } }
    if(act) n++; else XRSK[i].pts.visible=false;
  }
  return n;
}

async function startXR(mode,split){
  mode=(mode==='immersive-ar')?'immersive-ar':'immersive-vr';
  var err=$('err'); err.textContent='';
  var session=null;
  try{
    if(!navigator.xr) throw new Error('WebXR não está disponível neste navegador.');
    session=await navigator.xr.requestSession(mode,{optionalFeatures:['local-floor','bounded-floor','hand-tracking']});
    var type='local-floor'; X.floor=true;
    try{ await session.requestReferenceSpace('local-floor'); }catch(e1){ type='local'; X.floor=false; }
    renderer.xr.setReferenceSpaceType(type);
    renderer.xr.setFramebufferScaleFactor([0.7,0.85,1,1.2][S.q-1]);
    renderer.setClearColor(0x000000,mode==='immersive-ar'?0:1);     /* AR: fundo transparente (câmera do navegador) */
    await renderer.xr.setSession(session);
    X.session=session; X.ref=renderer.xr.getReferenceSpace(); X.on=true; X.hasPose=false; X.sel=[false,false]; X.saw=[false,false];
    X.mode=(mode==='immersive-ar')?'ar':'vr'; X.split=!!split&&X.mode==='ar';
    session.addEventListener('end',onXREnd);
    session.addEventListener('selectstart',onSelStart);
    session.addEventListener('selectend',onSelEnd);
    session.addEventListener('select',onSelect);
    HS.forEach(function(h){ h.sk.group.visible=false; h.active=false; h.pinch=false; h.pinchPrev=false; h.mode='xr'; h.screen=false; });
    rig.quaternion.set(0,0,0,1); rig.position.set(0,0,0);
    $('start').style.display='none'; $('rot').style.display='none';
    R.started=true; R.startT=performance.now(); R.placed=false; R.libP=0; R.dockP=0; R.quickOpen=false; R.quickP=0; R.head.set(0,0,0); R.org.set(0,0,0);
    applyVisual(); rebuildBubbles();
    renderer.setAnimationLoop(xrFrame);
  }catch(e){
    try{ if(session&&!X.on) session.end(); }catch(e2){}
    renderer.setClearColor(0x000000,1);
    err.textContent=(e&&e.name==='NotSupportedError')?(mode==='immersive-ar'?'Este aparelho não oferece WebXR AR (precisa de Android com ARCore e Chrome).':'Este aparelho não oferece WebXR VR (immersive-vr). iPhone/iOS não suporta; use o modo VR Box (giroscópio).'):((e&&e.message)||String(e));
  }
}
function endXR(){ try{ if(X.session) X.session.end(); }catch(e){} }
function onXREnd(){
  X.on=false; X.session=null; X.hasPose=false; X.mode='vr'; X.split=false;
  renderer.setAnimationLoop(null); renderer.setClearColor(0x000000,1);
  R.started=false; R.placed=false; R.libP=0; R.dockP=0; R.app=null; R.appP=0; R.appDir=0; R.quickOpen=false; R.quickP=0;
  appMesh.visible=false; libMesh.visible=false; dockMesh.visible=false; quickMesh.visible=false;
  R.head.set(0,0,0); R.org.set(0,0,0); sky.position.set(0,0,0);
  rig.quaternion.set(0,0,0,1); C.grab=-1; C.resize=-1;
  HS.forEach(function(h){ h.mode='cam'; h.screen=false; h.active=false; h.pinch=false; h.pinchPrev=false; h.conf=false; h.pk=null; });
  XRSK.forEach(function(k){ k.pts.visible=false; });
  cursors.forEach(function(c){ c.g.visible=false; });
  applyVisual(); resize();
  $('start').style.display='flex';
}

/* Bateria */
try{ if(navigator.getBattery){ navigator.getBattery().then(function(b){ var up=function(){ R.batLevel=b.level; R.bat=Math.round(b.level*100)+'%'; R.dockDirty=true; }; up(); b.addEventListener('levelchange',up); }).catch(function(){}); } }catch(e){}

/* ============================ INÍCIO ============================ */
async function startApp(stereo){
  var err=$('err'); err.textContent='';
  try{
    S.stereo=stereo; save();
    goFull();
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      var r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted') throw new Error('Permissão de movimento negada. Ative em Ajustes > Safari > Movimento e orientação.');
    }
    window.addEventListener('deviceorientation',onOri,true);
    try{ await startCamera(); }
    catch(ce){ R.camFail=true; S.camOn=false; if(S.env==='passthrough'){ S.env='space'; } }
    $('start').style.display='none';
    R.started=true; R.startT=performance.now();
    applyQuality(); applyVisual(); rebuildBubbles();
    if(R.camFail){ toast('Câmera indisponível'); }
    loadHands();
  }catch(e){ err.textContent=(e&&e.message)||String(e); }
}
$('bVR').addEventListener('click',function(){ startApp(true); });
$('bXR').addEventListener('click',function(){ startXR('immersive-vr',false); });
$('bAR').addEventListener('click',function(){ startXR('immersive-ar',false); });
$('bARS').addEventListener('click',function(){ startXR('immersive-ar',true); });
(function(){
  var note=$('xrNote');
  if(!navigator.xr){ note.textContent='WebXR (6DOF) indisponível neste navegador. Use o modo VR Box (giroscópio, 3DOF).'; return; }
  function done(){
    var t=[];
    if(X.supported) t.push('WebXR VR disponível (6DOF real).');
    if(X.supportedAR) t.push('WebXR AR disponível (Android/ARCore): 6DOF real com a câmera.');
    if(!t.length) t.push('Este aparelho não oferece WebXR (6DOF). Use o modo VR Box (giroscópio, 3DOF).');
    note.textContent=t.join(' ');
    R.dockDirty=true; R.libDirty=true;
  }
  var p1=navigator.xr.isSessionSupported('immersive-vr').then(function(ok){ X.supported=ok; if(ok) $('bXR').style.display=''; }).catch(function(){});
  var p2=navigator.xr.isSessionSupported('immersive-ar').then(function(ok){ X.supportedAR=ok; if(ok){ $('bAR').style.display=''; $('bARS').style.display=''; } }).catch(function(){});
  Promise.all([p1,p2]).then(done);
})();
$('bNormal').addEventListener('click',function(){ startApp(false); });

resize();
})();
