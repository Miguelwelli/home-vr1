<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Home VR</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  #gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
  #cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
  #start{position:fixed;left:0;top:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    text-align:center;padding:24px;background:radial-gradient(circle at 50% 25%,#26384d,#06080d)}
  #start h1{margin:0;font-size:34px}
  #start p{margin:0;max-width:340px;opacity:.7;line-height:1.45;font-size:15px}
  #start button{border:0;border-radius:999px;padding:15px 38px;font-size:17px;font-weight:700;background:#fff;color:#111;min-width:240px}
  #start button.sec{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
  #err{color:#ff9a9a;font-size:13px;min-height:16px;max-width:340px}
  #rot{position:fixed;left:0;top:0;right:0;bottom:0;z-index:20;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;
    background:rgba(0,0,0,.88);font-size:20px;line-height:1.4}
  #errbar{position:fixed;left:8px;right:8px;top:8px;z-index:99;display:none;background:rgba(160,30,30,.92);font-size:12px;padding:8px 12px;border-radius:12px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="gl"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="rot">Gire o celular para a horizontal<br>e coloque no VR Box</div>
<div id="errbar"></div>

<div id="start">
  <h1>Home VR</h1>
  <p>Coloque o celular na horizontal. O app vai pedir permissão de movimento e da câmera traseira (passthrough e rastreamento de mão).</p>
  <button id="bVR" type="button">Iniciar (VR Box)</button>
  <button id="bNormal" type="button" class="sec">Iniciar (tela normal)</button>
  <button id="bFull" type="button" class="sec">Tela cheia</button>
  <div id="err"></div>
</div>

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i);};
function showErr(m){ try{ var b=$('errbar'); b.style.display='block'; b.textContent='Erro: '+((m&&m.message)||m); }catch(_){} }
window.addEventListener('error',function(e){ showErr(e.message); });
window.addEventListener('unhandledrejection',function(e){ showErr(e.reason); });

function goFull(){
  try{
    var el=document.documentElement;
    var f=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
    if(f){ var p=f.call(el); if(p&&p.catch) p.catch(function(){}); }
    if(screen.orientation&&screen.orientation.lock){ screen.orientation.lock('landscape').catch(function(){}); }
  }catch(e){}
}
$('bFull').addEventListener('click',goFull);

if(typeof THREE==='undefined'){
  $('err').textContent='Não foi possível carregar o Three.js. Verifique a internet e recarregue.';
  return;
}

/* ============================ ESTADO ============================ */
var DEF={q:3,aa:true,stereo:true,fov:80,ui:1,ipd:63,bubbles:true,nb:8,bcol:0,env:'passthrough',camOn:true,camOpa:100,camBri:100,hands:true,skel:true,sens:3};
var S={}; for(var k0 in DEF){ S[k0]=DEF[k0]; }
try{ var sv=JSON.parse(localStorage.getItem('homevr2')||'{}'); for(var k1 in sv){ if(k1 in DEF) S[k1]=sv[k1]; } }catch(e){}
function save(){ try{ localStorage.setItem('homevr2',JSON.stringify(S)); }catch(e){} }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

var R={started:false,placed:false,startT:0,section:0,libOpen:true,hover:null,libDirty:true,dockDirty:true,
  toast:'',toastUntil:0,clock:'',bat:'',handModel:'aguardando',handSeen:false,pinch:false,lastClick:0,camFail:false};

/* ============================ RENDERER / CENA ============================ */
var canvas=$('gl');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setClearColor(0x000000,1);
var scene=new THREE.Scene();
var rig=new THREE.Object3D(); scene.add(rig);
var camL=new THREE.PerspectiveCamera(S.fov,1,0.05,80);
var camR=new THREE.PerspectiveCamera(S.fov,1,0.05,80);
var camC=new THREE.PerspectiveCamera(S.fov,1,0.05,80);
rig.add(camL); rig.add(camR); rig.add(camC);

var VW=1,VH=1,eyeA=1,BG=12,FW=1,FH=1;
var video=$('cam'), vtex=null, videoReady=false, MAP={rx:1,ry:1,ox:0,oy:0};

/* Plano de fundo com a câmera (passthrough) */
var bgGroup=new THREE.Group(); bgGroup.position.z=-BG; rig.add(bgGroup);
var vidMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,depthWrite:false,depthTest:false});
var vidPlane=new THREE.Mesh(new THREE.PlaneGeometry(1,1),vidMat);
vidPlane.renderOrder=-5; vidPlane.visible=false; vidPlane.frustumCulled=false; bgGroup.add(vidPlane);

/* Esqueleto da mão */
var HAND_CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
var skelPos=new Float32Array(21*3), skelLine=new Float32Array(HAND_CONN.length*2*3);
var ptsGeo=new THREE.BufferGeometry(); ptsGeo.setAttribute('position',new THREE.BufferAttribute(skelPos,3));
var linGeo=new THREE.BufferGeometry(); linGeo.setAttribute('position',new THREE.BufferAttribute(skelLine,3));
var skelPts=new THREE.Points(ptsGeo,new THREE.PointsMaterial({color:0x7dd3fc,size:7,sizeAttenuation:false,depthTest:false,transparent:true}));
var skelLin=new THREE.LineSegments(linGeo,new THREE.LineBasicMaterial({color:0x7dd3fc,depthTest:false,transparent:true,opacity:.8}));
var skel=new THREE.Group(); skel.add(skelLin); skel.add(skelPts); skel.visible=false; skel.position.z=0.05;
skelPts.renderOrder=-4; skelLin.renderOrder=-4; skelPts.frustumCulled=false; skelLin.frustumCulled=false;
bgGroup.add(skel);

/* Céu / ambientes virtuais */
var sky=new THREE.Mesh(new THREE.SphereGeometry(30,32,16),new THREE.MeshBasicMaterial({side:THREE.BackSide,depthWrite:false}));
sky.renderOrder=-10; sky.visible=false; scene.add(sky);
var skyCache={};
function mkSky(id){
  var W=1024,Hh=512,c=document.createElement('canvas'); c.width=W; c.height=Hh; var g=c.getContext('2d');
  function grad(st){ var gr=g.createLinearGradient(0,0,0,Hh); st.forEach(function(s){ gr.addColorStop(s[0],s[1]); }); g.fillStyle=gr; g.fillRect(0,0,W,Hh); }
  var i;
  if(id==='sunset'){
    grad([[0,'#14143a'],[.3,'#6a2f8a'],[.45,'#e0566b'],[.499,'#ffb35c'],[.5,'#2b1735'],[1,'#0c0814']]);
    var rg=g.createRadialGradient(W/2,Hh*.5,2,W/2,Hh*.5,230);
    rg.addColorStop(0,'rgba(255,240,180,1)'); rg.addColorStop(.25,'rgba(255,170,90,.6)'); rg.addColorStop(1,'rgba(255,120,60,0)');
    g.fillStyle=rg; g.fillRect(0,0,W,Hh/2);
  }else if(id==='city'){
    grad([[0,'#04060f'],[.35,'#12204a'],[.499,'#2b3f7a'],[.5,'#080b14'],[1,'#03040a']]);
    for(var x=0;x<W;){ var bw=16+Math.random()*34, bh=20+Math.random()*120;
      g.fillStyle='#070b16'; g.fillRect(x,256-bh,bw,bh);
      for(var wy=256-bh+6;wy<250;wy+=9){ for(var wx=x+4;wx<x+bw-4;wx+=7){ if(Math.random()<.35){ g.fillStyle=Math.random()<.5?'#ffd27a':'#9fd2ff'; g.fillRect(wx,wy,3,4); } } }
      x+=bw+Math.random()*6; }
  }else if(id==='space'){
    grad([[0,'#000'],[1,'#000']]);
    [['rgba(120,60,200,.35)',200,140],['rgba(40,110,220,.3)',700,330],['rgba(220,80,150,.22)',520,90]].forEach(function(n){
      var r=g.createRadialGradient(n[1],n[2],10,n[1],n[2],220); r.addColorStop(0,n[0]); r.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=r; g.fillRect(0,0,W,Hh); });
    for(i=0;i<900;i++){ g.fillStyle='rgba(255,255,255,'+(0.3+Math.random()*.7)+')'; var s=Math.random()<.9?1:2; g.fillRect(Math.random()*W,Math.random()*Hh,s,s); }
  }else if(id==='beach'){
    grad([[0,'#3b8fe8'],[.35,'#8ccbff'],[.499,'#d6f0ff'],[.5,'#2fb4d6'],[.62,'#1a86b5'],[.63,'#ecd9a6'],[1,'#c9b27c']]);
    var sg=g.createRadialGradient(300,150,4,300,150,70); sg.addColorStop(0,'#fff'); sg.addColorStop(.3,'rgba(255,245,200,.9)'); sg.addColorStop(1,'rgba(255,245,200,0)');
    g.fillStyle=sg; g.fillRect(200,50,200,200);
  }else{
    grad([[0,'#0a0d14'],[1,'#030406']]);
  }
  var t=new THREE.CanvasTexture(c); t.minFilter=THREE.LinearFilter; t.generateMipmaps=false; return t;
}

/* ============================ UI (canvas -> textura) ============================ */
var FONT='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
var UW=1024,UH=640,US=2, DW=760,DH=150;
var uiC=document.createElement('canvas'); uiC.width=UW*US; uiC.height=UH*US; var ug=uiC.getContext('2d');
var dkC=document.createElement('canvas'); dkC.width=DW*US; dkC.height=DH*US; var dg=dkC.getContext('2d');
function mkTex(c){
  var t=new THREE.CanvasTexture(c);
  try{ t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy()); }catch(e){}
  if(!renderer.capabilities.isWebGL2){ t.generateMipmaps=false; t.minFilter=THREE.LinearFilter; }
  return t;
}
var libTex=mkTex(uiC), dockTex=mkTex(dkC);
var libMesh=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:libTex,transparent:true,depthWrite:false}));
var dockMesh=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:dockTex,transparent:true,depthWrite:false}));
libMesh.renderOrder=10; dockMesh.renderOrder=11; libMesh.visible=false; dockMesh.visible=false;
libMesh.userData={w:UW,h:UH,hits:[]}; dockMesh.userData={w:DW,h:DH,hits:[]};
scene.add(libMesh); scene.add(dockMesh);

function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function chg(){ save(); R.libDirty=true; R.dockDirty=true; }
function toast(t){ R.toast=t; R.toastUntil=performance.now()+1800; R.dockDirty=true; }
function setSection(i){ R.section=i; R.libOpen=true; chg(); }

var SEC=[['🏠','Início'],['🫧','Bolhas'],['🌅','Ambientes'],['📷','Passthrough'],['✋','Mãos'],['⚙️','Ajustes']];
var APPS=[['Câmera','📷','#f0627f,#d93a5c'],['Navegador','🧭','#b59bff,#5b8cff'],['TV','📺','#f7843b,#e4467a'],['Feed','📰','#4aa3ff,#2563eb'],['Jogos','🎮','#7c6cff,#3b2fd9'],['Loja','🛍️','#ffb347,#ef7d1a']];
var ENVS=[['passthrough','Passthrough','📷','#38bdf8,#4f46e5'],['sunset','Pôr do sol','🌅','#fb923c,#db2777'],['city','Cidade','🌃','#6366f1,#0f172a'],['space','Espaço','🌌','#4c1d95,#0f172a'],['beach','Praia','🏖️','#fde047,#06b6d4'],['dark','Escuro','🌑','#475569,#0f172a']];
var BCOLS=['#7dd3fc','#f9a8d4','#86efac','#ffffff'];

function drawLib(){
  var g=ug, hits=[], hov=R.hover;
  g.setTransform(US,0,0,US,0,0); g.clearRect(0,0,UW,UH);
  function hit(x,y,w,h,id,fn){ hits.push({x:x,y:y,w:w,h:h,id:id,fn:fn}); }
  rr(g,0,0,UW,UH,36); g.fillStyle='rgba(34,41,47,0.97)'; g.fill(); g.lineWidth=2; g.strokeStyle='rgba(255,255,255,.12)'; g.stroke();
  g.textBaseline='middle'; g.textAlign='center'; g.fillStyle='rgba(255,255,255,.7)'; g.font='500 24px '+FONT; g.fillText('Biblioteca',UW/2,36);
  function ctl(id,cx,glyph){
    if(hov===id){ g.fillStyle='rgba(255,255,255,.2)'; g.beginPath(); g.arc(cx,36,22,0,6.283); g.fill(); }
    g.fillStyle='#fff'; g.textAlign='center'; g.font='400 26px '+FONT; g.fillText(glyph,cx,37);
    hit(cx-24,12,48,48,id,function(){ R.libOpen=false; });
  }
  ctl('w-min',940,'—'); ctl('w-close',984,'✕');

  SEC.forEach(function(s,i){
    var y=84+i*68, id='sec'+i, on=R.section===i;
    if(on||hov===id){ rr(g,28,y,230,60,16); g.fillStyle=on?'rgba(255,255,255,.16)':'rgba(255,255,255,.08)'; g.fill(); }
    g.textAlign='left'; g.fillStyle='#fff'; g.font='400 28px '+FONT; g.fillText(s[0],46,y+31);
    g.font=(on?'600 ':'400 ')+'25px '+FONT; g.fillText(s[1],92,y+31);
    hit(28,y,230,60,id,function(){ R.section=i; R.libDirty=true; });
  });

  g.textAlign='left'; g.fillStyle='#fff'; g.font='700 36px '+FONT; g.fillText(SEC[R.section][1],288,100);

  function toggle(id,y,label,val,fn){
    if(hov===id){ rr(g,282,y-6,716,60,16); g.fillStyle='rgba(255,255,255,.07)'; g.fill(); }
    g.textAlign='left'; g.fillStyle='#fff'; g.font='400 26px '+FONT; g.fillText(label,296,y+24);
    rr(g,896,y,96,48,24); g.fillStyle=val?'#3b82f6':'rgba(255,255,255,.22)'; g.fill();
    g.beginPath(); g.arc(val?968:920,y+24,18,0,6.283); g.fillStyle='#fff'; g.fill();
    hit(282,y-6,716,60,id,fn);
  }
  function stepper(id,y,label,txt,dec,inc){
    g.textAlign='left'; g.fillStyle='#fff'; g.font='400 26px '+FONT; g.fillText(label,296,y+24);
    var bm=hov===id+'-', bp=hov===id+'+';
    rr(g,808,y,56,48,24); g.fillStyle=bm?'rgba(255,255,255,.34)':'rgba(255,255,255,.16)'; g.fill();
    rr(g,936,y,56,48,24); g.fillStyle=bp?'rgba(255,255,255,.34)':'rgba(255,255,255,.16)'; g.fill();
    g.fillStyle='#fff'; g.textAlign='center'; g.font='600 30px '+FONT; g.fillText('−',836,y+23); g.fillText('+',964,y+23);
    g.font='600 24px '+FONT; g.fillText(txt,900,y+24);
    hit(808,y,56,48,id+'-',dec); hit(936,y,56,48,id+'+',inc);
  }
  function button(id,x,y,w,h,label,fn){
    rr(g,x,y,w,h,h/2); g.fillStyle=hov===id?'rgba(255,255,255,.34)':'rgba(255,255,255,.16)'; g.fill();
    g.fillStyle='#fff'; g.textAlign='center'; g.font='600 24px '+FONT; g.fillText(label,x+w/2,y+h/2+1); hit(x,y,w,h,id,fn);
  }
  function tile(id,x,y,w,h,gr,emoji,label,fn,sel){
    var c=gr.split(','), lg=g.createLinearGradient(x,y,x+w,y+h); lg.addColorStop(0,c[0]); lg.addColorStop(1,c[1]);
    rr(g,x,y,w,h,22); g.fillStyle=lg; g.fill();
    var gl=g.createLinearGradient(0,y,0,y+h); gl.addColorStop(0,'rgba(255,255,255,.28)'); gl.addColorStop(.55,'rgba(255,255,255,0)'); rr(g,x,y,w,h,22); g.fillStyle=gl; g.fill();
    g.textAlign='center'; g.fillStyle='#fff'; g.font='400 68px '+FONT; g.fillText(emoji,x+w/2,y+h/2+4);
    if(sel||hov===id){ rr(g,x,y,w,h,22); g.lineWidth=sel?6:4; g.strokeStyle=sel?'#60a5fa':'rgba(255,255,255,.9)'; g.stroke(); }
    g.font='500 24px '+FONT; g.fillStyle='#fff'; g.fillText(label,x+w/2,y+h+24);
    hit(x,y,w,h+40,id,fn);
  }
  function info(t,y){ g.textAlign='left'; g.fillStyle='rgba(255,255,255,.6)'; g.font='400 22px '+FONT; g.fillText(t,296,y); }

  var sc=R.section, i, y0=150;
  if(sc===0){
    APPS.forEach(function(a,n){
      var cx=288+(n%3)*244, cy=140+Math.floor(n/3)*210;
      tile('app'+n,cx,cy,216,150,a[2],a[1],a[0],function(){ if(a[0]==='Câmera'){ setSection(3); } else { toast('Abrindo '+a[0]+'…'); } },false);
    });
  }else if(sc===1){
    toggle('b-on',y0,'Bolhas flutuantes',S.bubbles,function(){ S.bubbles=!S.bubbles; applyBubbles(); chg(); });
    stepper('b-n',y0+70,'Quantidade',String(S.nb),function(){ S.nb=clamp(S.nb-2,2,20); rebuildBubbles(); chg(); },function(){ S.nb=clamp(S.nb+2,2,20); rebuildBubbles(); chg(); });
    g.textAlign='left'; g.fillStyle='#fff'; g.font='400 26px '+FONT; g.fillText('Cor',296,y0+164);
    BCOLS.forEach(function(c,n){ var cx=724+n*72, id='bc'+n;
      g.beginPath(); g.arc(cx,y0+164,24,0,6.283); g.fillStyle=c; g.fill();
      if(S.bcol===n||hov===id){ g.lineWidth=5; g.strokeStyle=S.bcol===n?'#60a5fa':'#fff'; g.beginPath(); g.arc(cx,y0+164,30,0,6.283); g.stroke(); }
      hit(cx-32,y0+132,64,64,id,function(){ S.bcol=n; setBubbleColors(); chg(); }); });
    info('Estoure as bolhas com a pinça (ou toque na tela).',y0+250);
  }else if(sc===2){
    ENVS.forEach(function(e,n){
      var cx=288+(n%3)*244, cy=140+Math.floor(n/3)*210;
      tile('env'+n,cx,cy,216,150,e[3],e[2],e[1],function(){ setEnv(e[0]); },S.env===e[0]);
    });
  }else if(sc===3){
    toggle('c-on',y0,'Mostrar câmera',S.camOn,function(){ S.camOn=!S.camOn; applyVisual(); chg(); });
    stepper('c-o',y0+70,'Opacidade',S.camOpa+'%',function(){ S.camOpa=clamp(S.camOpa-10,0,100); applyVisual(); chg(); },function(){ S.camOpa=clamp(S.camOpa+10,0,100); applyVisual(); chg(); });
    stepper('c-b',y0+140,'Brilho',S.camBri+'%',function(){ S.camBri=clamp(S.camBri-10,50,150); applyVisual(); chg(); },function(){ S.camBri=clamp(S.camBri+10,50,150); applyVisual(); chg(); });
    info(R.camFail?'Câmera indisponível: verifique a permissão.':'Câmera traseira ativa.',y0+236);
  }else if(sc===4){
    toggle('h-on',y0,'Rastreamento de mãos',S.hands,function(){ S.hands=!S.hands; if(!S.hands){ HD.pinchNow=false; } chg(); });
    toggle('h-sk',y0+70,'Mostrar esqueleto da mão',S.skel,function(){ S.skel=!S.skel; chg(); });
    stepper('h-s',y0+140,'Sensibilidade da pinça',String(S.sens),function(){ S.sens=clamp(S.sens-1,1,5); chg(); },function(){ S.sens=clamp(S.sens+1,1,5); chg(); });
    info('Modelo: '+R.handModel,y0+244);
    info('Mão: '+(R.handSeen?'detectada':'não detectada'),y0+284);
    info('Pinça: '+(R.pinch?'ativa':'inativa'),y0+324);
    info('Junte polegar e indicador para clicar.',y0+372);
  }else{
    stepper('s-q',y0-6,'Qualidade gráfica',String(S.q),function(){ S.q=clamp(S.q-1,1,4); applyQuality(); chg(); },function(){ S.q=clamp(S.q+1,1,4); applyQuality(); chg(); });
    toggle('s-aa',y0+52,'Antisserrilhado',S.aa,function(){ S.aa=!S.aa; applyQuality(); chg(); });
    toggle('s-st',y0+110,'Modo VR Box (tela dividida)',S.stereo,function(){ S.stereo=!S.stereo; resize(); chg(); });
    stepper('s-f',y0+168,'Campo de visão',S.fov+'°',function(){ S.fov=clamp(S.fov-5,60,110); resize(); chg(); },function(){ S.fov=clamp(S.fov+5,60,110); resize(); chg(); });
    stepper('s-u',y0+226,'Tamanho da interface',Math.round(S.ui*100)+'%',function(){ S.ui=clamp(Math.round((S.ui-0.1)*10)/10,0.7,1.5); layout(); chg(); },function(){ S.ui=clamp(Math.round((S.ui+0.1)*10)/10,0.7,1.5); layout(); chg(); });
    stepper('s-i',y0+284,'Distância das lentes',S.ipd+' mm',function(){ S.ipd=clamp(S.ipd-1,54,72); resize(); chg(); },function(){ S.ipd=clamp(S.ipd+1,54,72); resize(); chg(); });
    button('s-full',288,y0+350,330,54,'Tela cheia',function(){ goFull(); });
    button('s-rec',662,y0+350,330,54,'Recentralizar',function(){ recenter(); toast('Recentralizado'); });
  }
  libMesh.userData.hits=hits; libTex.needsUpdate=true;
}

function drawDock(){
  var g=dg, hits=[], hov=R.hover;
  g.setTransform(US,0,0,US,0,0); g.clearRect(0,0,DW,DH);
  function hit(x,y,w,h,id,fn){ hits.push({x:x,y:y,w:w,h:h,id:id,fn:fn}); }

  g.textBaseline='middle';
  var ag=g.createLinearGradient(28,68,76,116); ag.addColorStop(0,'#f5a65b'); ag.addColorStop(1,'#d9576b');

  function circ(id,cx,glyph,on,fn){

    g.textAlign='center'; g.font='400 24px '+FONT; g.fillStyle=on?'#111':'#fff'; g.fillText(glyph,cx,93); hit(cx-24,68,48,48,id,fn);

  circ('d-bell',336,'🔔',false,function(){ toast('Sem notificações'); });
  circ('d-vr',390,'🥽',S.stereo,function(){ S.stereo=!S.stereo; resize(); chg(); toast(S.stereo?'Modo VR Box':'Tela normal'); });
  [['🫧',1,'#4aa3ff,#2563eb'],['🌅',2,'#ffb347,#ef7d1a'],['📷',3,'#ff7aa8,#e11d48'],['✋',4,'#a78bfa,#6d4aff']].forEach(function(s,n){
    var x=432+n*56, id='d-s'+n, c=s[2].split(','), lg=g.createLinearGradient(x,70,x+44,114); lg.addColorStop(0,c[0]); lg.addColorStop(1,c[1]);
    rr(g,x,70,44,44,13); g.fillStyle=lg; g.fill();

    g.textAlign='center'; g.font='400 24px '+FONT; g.fillStyle='#fff'; g.fillText(s[0],x+22,93);
    hit(x,70,44,44,id,function(){ setSection(s[1]); });
  });
  g.fillStyle='rgba(255,255,255,.22)'; g.fillRect(662,74,2,36);
  g.beginPath(); g.arc(706,92,24,0,6.283); g.fillStyle=R.libOpen?'#fff':(hov==='d-grid'?'rgba(255,255,255,.34)':'rgba(255,255,255,.16)'); g.fill();
  g.fillStyle=R.libOpen?'#111':'#fff';
  for(var a=0;a<3;a++){ for(var b=0;b<3;b++){ g.beginPath(); g.arc(696+a*10,82+b*10,2.8,0,6.283); g.fill(); } }
  hit(682,68,48,48,'d-grid',function(){ R.libOpen=!R.libOpen; R.dockDirty=true; });
  rr(g,DW/2-58,136,116,7,3.5); g.fillStyle=hov==='d-handle'?'#fff':'rgba(255,255,255,.7)'; g.fill();
  hit(DW/2-72,128,144,22,'d-handle',function(){ recenter(); toast('Recentralizado'); });
  dockMesh.userData.hits=hits; dockTex.needsUpdate=true;
}

/* ============================ LAYOUT 3D ============================ */
var fwd=new THREE.Vector3(0,0,-1), tmpV=new THREE.Vector3();
function layout(){
  var u=S.ui, ly=0.12;
  libMesh.scale.set(1.5*u,0.9375*u,1);
  libMesh.position.set(fwd.x*1.15,ly,fwd.z*1.15);
  libMesh.lookAt(0,ly,0);
  var dy=ly-0.469*u-0.19*u;
  dockMesh.scale.set(1.0*u,(DH/DW)*1.0*u,1);
  dockMesh.position.set(fwd.x*1.0,dy,fwd.z*1.0);
  dockMesh.lookAt(0,dy+0.4,0);
  libMesh.updateMatrixWorld(true); dockMesh.updateMatrixWorld(true);
}
function recenter(){
  rig.updateMatrixWorld(true);
  camC.getWorldDirection(tmpV); tmpV.y=0;
  if(tmpV.lengthSq()>0.01){ fwd.copy(tmpV.normalize()); }
  layout();
}

/* ============================ AJUSTES VISUAIS ============================ */
function applyQuality(){
  var pr=Math.min(window.devicePixelRatio||1,2)*[0.6,0.8,1,1.3][S.q-1]*(S.aa?1.25:1);
  renderer.setPixelRatio(Math.min(pr,3));
  resize();
}
function layoutBg(){
  var h=2*BG*Math.tan(THREE.MathUtils.degToRad(S.fov/2));
  FH=h; FW=h*eyeA;
  vidPlane.scale.set(FW*1.08,FH*1.08,1);
}
function updateVideoMap(){
  if(!vtex||!video.videoWidth) return;
  var va=video.videoWidth/video.videoHeight, rx=1, ry=1;
  if(va>eyeA){ rx=eyeA/va; } else { ry=va/eyeA; }
  vtex.repeat.set(rx,ry); vtex.offset.set((1-rx)/2,(1-ry)/2);
  MAP={rx:rx,ry:ry,ox:(1-rx)/2,oy:(1-ry)/2};
}
function resize(){
  VW=window.innerWidth; VH=window.innerHeight;
  renderer.setSize(VW,VH,false);
  eyeA=S.stereo?(VW/2)/VH:VW/VH;
  [camL,camR,camC].forEach(function(c){ c.fov=S.fov; c.aspect=eyeA; c.updateProjectionMatrix(); });
  camL.position.x=S.stereo?-S.ipd/2000:0; camR.position.x=S.ipd/2000;
  layoutBg(); updateVideoMap();
  $('rot').style.display=(R.started&&S.stereo&&VH>VW)?'flex':'none';
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,250); });
video.addEventListener('resize',updateVideoMap);

function applyVisual(){
  sky.visible=S.env!=='passthrough';
  if(sky.visible){
    if(!skyCache[S.env]) skyCache[S.env]=mkSky(S.env);
    sky.material.map=skyCache[S.env]; sky.material.needsUpdate=true;
  }
  vidPlane.visible=videoReady&&S.camOn;
  vidMat.opacity=S.camOpa/100;
  vidMat.color.setScalar(S.camBri/100);
}
function setEnv(id){
  S.env=id;
  if(id==='passthrough'){ S.camOn=true; S.camOpa=100; if(R.camFail) toast('Câmera indisponível'); } else { S.camOn=false; }
  applyVisual(); chg();
}

/* ============================ BOLHAS ============================ */
var bubbles=[], bubGeo=new THREE.SphereGeometry(1,24,16), hiGeo=new THREE.SphereGeometry(0.16,10,8);
function spawn(b){
  var th=Math.random()*6.283, r=1.5+Math.random()*1.8;
  b.userData.base.set(Math.cos(th)*r,-0.6+Math.random()*2.1,Math.sin(th)*r);
  b.userData.pop=0; b.userData.rad=0.09+Math.random()*0.13; b.userData.ph=Math.random()*6.283;
  b.scale.setScalar(b.userData.rad); b.material.opacity=0.34;
}
function rebuildBubbles(){
  bubbles.forEach(function(b){ scene.remove(b); b.material.dispose(); });
  bubbles=[];
  for(var i=0;i<S.nb;i++){
    var m=new THREE.Mesh(bubGeo,new THREE.MeshBasicMaterial({color:BCOLS[S.bcol],transparent:true,opacity:0.34,depthWrite:false}));
    m.userData={base:new THREE.Vector3(),pop:0,rad:.1,ph:0};
    var hi=new THREE.Mesh(hiGeo,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.7,depthWrite:false})); hi.position.set(-0.4,0.45,0.55); m.add(hi);
    m.renderOrder=3; spawn(m); m.visible=S.bubbles; scene.add(m); bubbles.push(m);
  }
}
function applyBubbles(){ bubbles.forEach(function(b){ b.visible=S.bubbles; }); }
function setBubbleColors(){ bubbles.forEach(function(b){ b.material.color.set(BCOLS[S.bcol]); }); }
function popBubble(b){ if(!b.userData.pop){ b.userData.pop=performance.now(); } }
function updateBubbles(now){
  var t=now/1000;
  for(var i=0;i<bubbles.length;i++){
    var b=bubbles[i], d=b.userData;
    b.position.set(d.base.x+Math.sin(t*.6+d.ph)*.12,d.base.y+Math.sin(t*.8+d.ph*1.3)*.15,d.base.z+Math.cos(t*.5+d.ph)*.1);
    if(d.pop){
      var k=(now-d.pop)/260;
      if(k>=1){ spawn(b); }
      else{ b.scale.setScalar(d.rad*(1+k*.9)); b.material.opacity=.34*(1-k); b.children[0].material.opacity=.7*(1-k); }
    }else{ b.children[0].material.opacity=.7; }
  }
}

/* ============================ GIROSCÓPIO ============================ */
var targetQ=new THREE.Quaternion(), q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)), zee=new THREE.Vector3(0,0,1), eu=new THREE.Euler(), q0=new THREE.Quaternion();
var gotOri=false, yaw=0, pitch=0;
function onOri(e){
  try{
    if(e.alpha==null||e.beta==null||e.gamma==null) return;
    gotOri=true;
    var d=THREE.MathUtils.degToRad;
    var orient=d((screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(window.orientation||0));
    eu.set(d(e.beta),d(e.alpha),-d(e.gamma),'YXZ');
    targetQ.setFromEuler(eu); targetQ.multiply(q1); targetQ.multiply(q0.setFromAxisAngle(zee,-orient));
  }catch(err){ showErr(err); }
}
window.addEventListener('pointermove',function(ev){
  if(!R.started||gotOri||!ev.buttons) return;
  yaw-=(ev.movementX||0)*.005; pitch=clamp(pitch-(ev.movementY||0)*.005,-1.4,1.4);
  eu.set(pitch,yaw,0,'YXZ'); targetQ.setFromEuler(eu);
});

/* ============================ MÃOS (MediaPipe) ============================ */
var HD={raw:new THREE.Vector2(),cur:new THREE.Vector2(),lock:new THREE.Vector2(),lastSeen:0,pinchNow:false,pinchPrev:false,pinching:false,hist:[]};
var hands=null, hBusy=false, HANDS_BASE='https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/';
function loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=src; s.crossOrigin='anonymous'; s.onload=res; s.onerror=function(){ rej(new Error('falha ao carregar '+src)); }; document.head.appendChild(s); }); }
function lmToNdc(x,y){ var su=((x)-MAP.ox)/MAP.rx, sv=((1-y)-MAP.oy)/MAP.ry; return {x:su*2-1,y:sv*2-1}; }
function onHands(res){
  try{
    var lm=res.multiHandLandmarks&&res.multiHandLandmarks[0];
    if(!lm){ HD.pinchNow=false; return; }
    HD.lastSeen=performance.now();
    var vw=video.videoWidth||1, vh=video.videoHeight||1;
    var n=lmToNdc(lm[8].x,lm[8].y); HD.raw.set(n.x,n.y);
    var d=Math.hypot((lm[4].x-lm[8].x)*vw,(lm[4].y-lm[8].y)*vh);
    var sz=Math.hypot((lm[0].x-lm[9].x)*vw,(lm[0].y-lm[9].y)*vh)||1;
    var ratio=d/sz, on=0.22+0.04*S.sens, off=on+0.12;
    if(!HD.pinchNow&&ratio<on) HD.pinchNow=true; else if(HD.pinchNow&&ratio>off) HD.pinchNow=false;
    var hx=FW/2, hy=FH/2, i;
    for(i=0;i<21;i++){ var p=lmToNdc(lm[i].x,lm[i].y); skelPos[i*3]=p.x*hx; skelPos[i*3+1]=p.y*hy; skelPos[i*3+2]=0; }
    for(i=0;i<HAND_CONN.length;i++){
      var a=HAND_CONN[i][0], b=HAND_CONN[i][1];
      skelLine[i*6]=skelPos[a*3]; skelLine[i*6+1]=skelPos[a*3+1]; skelLine[i*6+2]=0;
      skelLine[i*6+3]=skelPos[b*3]; skelLine[i*6+4]=skelPos[b*3+1]; skelLine[i*6+5]=0;
    }
    ptsGeo.attributes.position.needsUpdate=true; linGeo.attributes.position.needsUpdate=true;
  }catch(e){ showErr(e); }
}
function handsLoop(){
  if(!hands) return;
  if(S.hands&&videoReady&&video.readyState>=2&&!hBusy){
    hBusy=true;
    var p; try{ p=hands.send({image:video}); }catch(e){ hBusy=false; setTimeout(handsLoop,200); return; }
    Promise.resolve(p).catch(function(){}).then(function(){ hBusy=false; setTimeout(handsLoop,12); });
  }else{ setTimeout(handsLoop,120); }
}
function loadHands(){
  R.handModel='carregando…'; R.libDirty=true;
  loadScript(HANDS_BASE+'hands.js').then(function(){
    hands=new window.Hands({locateFile:function(f){ return HANDS_BASE+f; }});
    hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:0.5,minTrackingConfidence:0.5,selfieMode:false});
    hands.onResults(onHands);
    return hands.initialize();
  }).then(function(){ R.handModel='pronto'; R.libDirty=true; handsLoop(); })
  .catch(function(e){ R.handModel='erro (use toque na tela)'; R.libDirty=true; hands=null; });
}

/* ============================ CÂMERA TRASEIRA (0,5x quando possível) ============================ */
async function startCamera(){
  var base={width:{ideal:1280},height:{ideal:720}};
  var stream=await navigator.mediaDevices.getUserMedia({video:Object.assign({facingMode:{ideal:'environment'}},base),audio:false});
  try{
    var devs=await navigator.mediaDevices.enumerateDevices();
    var ultra=devs.filter(function(d){ return d.kind==='videoinput'&&/ultra/i.test(d.label)&&!/front|frontal|user/i.test(d.label); })[0];
    var cur=stream.getVideoTracks()[0].getSettings().deviceId;
    if(ultra&&ultra.deviceId!==cur){
      var s2=await navigator.mediaDevices.getUserMedia({video:Object.assign({deviceId:{exact:ultra.deviceId}},base),audio:false});
      stream.getTracks().forEach(function(t){ t.stop(); }); stream=s2;
    }else{
      var tr=stream.getVideoTracks()[0], cap=tr.getCapabilities?tr.getCapabilities():null;
      if(cap&&cap.zoom&&cap.zoom.min<1){ await tr.applyConstraints({advanced:[{zoom:cap.zoom.min}]}); }
    }
  }catch(e){}
  video.srcObject=stream; await video.play();
  vtex=new THREE.VideoTexture(video); vtex.minFilter=THREE.LinearFilter; vtex.magFilter=THREE.LinearFilter; vtex.generateMipmaps=false;
  vidMat.map=vtex; vidMat.needsUpdate=true; videoReady=true;
  updateVideoMap(); applyVisual();
}

/* ============================ INTERAÇÃO ============================ */
var ray=new THREE.Raycaster(), pickRes=null;
function pick(ndc){
  ray.setFromCamera(ndc,camC);
  var objs=[]; if(R.libOpen) objs.push(libMesh); objs.push(dockMesh);
  var hh=ray.intersectObjects(objs,false);
  if(hh.length&&hh[0].uv){
    var m=hh[0].object, u=hh[0].uv.x*m.userData.w, v=(1-hh[0].uv.y)*m.userData.h, list=m.userData.hits;
    for(var i=list.length-1;i>=0;i--){ var e=list[i]; if(u>=e.x&&u<=e.x+e.w&&v>=e.y&&v<=e.y+e.h) return {kind:'ui',e:e,point:hh[0].point}; }
    return {kind:'ui',e:null,point:hh[0].point};
  }
  if(S.bubbles){
    var bh=ray.intersectObjects(bubbles,false);
    if(bh.length) return {kind:'bubble',b:bh[0].object,point:bh[0].point};
  }
  return {kind:'none',point:ray.ray.at(1.6,new THREE.Vector3())};
}
function doClick(pk){
  if(!pk) return;
  if(pk.kind==='ui'&&pk.e&&pk.e.fn){ pk.e.fn(); R.libDirty=true; R.dockDirty=true; }
  else if(pk.kind==='bubble'){ popBubble(pk.b); }
}
document.addEventListener('pointerdown',function(ev){
  if(!R.started) return;
  var now=performance.now(); if(now-R.lastClick<250) return; R.lastClick=now;
  doClick(pickRes);
});

/* Cursor 3D */
var cursor=new THREE.Group();
var cRing=new THREE.Mesh(new THREE.RingGeometry(0.9,1,32),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,depthTest:false,side:THREE.DoubleSide}));
var cDot=new THREE.Mesh(new THREE.CircleGeometry(0.28,20),new THREE.MeshBasicMaterial({color:0x60a5fa,transparent:true,depthTest:false,side:THREE.DoubleSide}));
cRing.renderOrder=30; cDot.renderOrder=31; cursor.add(cRing); cursor.add(cDot); cursor.visible=false; scene.add(cursor);

/* ============================ LOOP ============================ */
var lastMin=-1;
function frame(now){
  requestAnimationFrame(frame);
  if(!R.started) return;
  try{
    if(!R.placed&&(gotOri||now-R.startT>1500)){
      rig.quaternion.copy(targetQ); rig.updateMatrixWorld(true);
      recenter(); R.placed=true; libMesh.visible=true; dockMesh.visible=true; R.libDirty=true; R.dockDirty=true;
    }
    var ang=rig.quaternion.angleTo(targetQ);
    rig.quaternion.slerp(targetQ,clamp(0.08+ang*1.8,0.08,0.6));   /* anti-tremor adaptativo */
    updateBubbles(now);
    scene.updateMatrixWorld(true);

    var d=new Date(), mn=d.getHours()*60+d.getMinutes();
    if(mn!==lastMin){ lastMin=mn; R.clock=d.getHours()+':'+('0'+d.getMinutes()).slice(-2); R.dockDirty=true; }
    if(R.toast&&now>R.toastUntil){ R.toast=''; R.dockDirty=true; }

    var handActive=S.hands&&(now-HD.lastSeen<450);
    if(handActive!==R.handSeen){ R.handSeen=handActive; if(R.section===4) R.libDirty=true; }
    if(handActive){ if(!HD.pinching){ HD.cur.x+=(HD.raw.x-HD.cur.x)*0.4; HD.cur.y+=(HD.raw.y-HD.cur.y)*0.4; } }
    else{ HD.cur.set(0,0); }
    HD.hist.push({t:now,x:HD.cur.x,y:HD.cur.y});
    while(HD.hist.length>2&&now-HD.hist[0].t>500) HD.hist.shift();
    var pn=handActive&&HD.pinchNow;
    if(pn&&!HD.pinchPrev){
      var ref=HD.hist[0];
      for(var i=0;i<HD.hist.length;i++){ if(now-HD.hist[i].t<=160){ ref=HD.hist[Math.max(0,i-1)]; break; } }
      HD.lock.set(ref.x,ref.y); HD.pinching=true;
      if(now-R.lastClick>300){ R.lastClick=now; doClick(pick(HD.lock)); }
    }
    if(!pn) HD.pinching=false;
    HD.pinchPrev=pn;
    if(pn!==R.pinch){ R.pinch=pn; if(R.section===4) R.libDirty=true; }

    pickRes=pick(HD.pinching?HD.lock:HD.cur);
    var hid=(pickRes.kind==='ui'&&pickRes.e)?pickRes.e.id:null;
    if(hid!==R.hover){ R.hover=hid; R.libDirty=true; R.dockDirty=true; }

    if(R.libDirty&&R.libOpen&&R.placed){ drawLib(); R.libDirty=false; }
    if(R.dockDirty&&R.placed){ drawDock(); R.dockDirty=false; }
    libMesh.visible=R.libOpen&&R.placed;

    skel.visible=S.skel&&handActive&&videoReady&&S.camOn;
    skelPts.material.color.set(pn?0x4ade80:0x7dd3fc); skelLin.material.color.set(pn?0x4ade80:0x7dd3fc);

    /* cursor */
    cursor.visible=R.placed;
    if(R.placed){
      var dist=Math.max(0.3,pickRes.point.length());
      cursor.position.copy(pickRes.point).multiplyScalar(0.99);
      cursor.quaternion.copy(rig.quaternion);
      cursor.scale.setScalar(dist*0.022);
      cDot.scale.setScalar(pn?1.6:0.7);
      cRing.material.color.set(handActive?0xffffff:0xbfdbfe);
    }

    var W=VW, Hh=VH;
    renderer.setScissorTest(true);
    if(S.stereo){
      renderer.setViewport(0,0,W/2,Hh); renderer.setScissor(0,0,W/2,Hh); renderer.render(scene,camL);
      renderer.setViewport(W/2,0,W/2,Hh); renderer.setScissor(W/2,0,W/2,Hh); renderer.render(scene,camR);
    }else{
      renderer.setViewport(0,0,W,Hh); renderer.setScissor(0,0,W,Hh); renderer.render(scene,camL);
    }
  }catch(e){ showErr(e); }
}
requestAnimationFrame(frame);

/* Bateria */
try{ if(navigator.getBattery){ navigator.getBattery().then(function(b){ var up=function(){ R.bat=Math.round(b.level*100)+'%'; R.dockDirty=true; }; up(); b.addEventListener('levelchange',up); }).catch(function(){}); } }catch(e){}

/* ============================ INÍCIO ============================ */
async function startApp(stereo){
  var err=$('err'); err.textContent='';
  try{
    S.stereo=stereo; save();
    goFull();
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      var r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted') throw new Error('Permissão de movimento negada. Ative em Ajustes > Safari > Movimento e orientação.');
    }
    window.addEventListener('deviceorientation',onOri,true);
    try{ await startCamera(); }
    catch(ce){ R.camFail=true; S.camOn=false; if(S.env==='passthrough'){ S.env='space'; } }
    $('start').style.display='none';
    R.started=true; R.startT=performance.now();
    applyQuality(); applyVisual(); rebuildBubbles();
    if(R.camFail){ toast('Câmera indisponível'); }
    loadHands();
  }catch(e){ err.textContent=(e&&e.message)||String(e); }
}
$('bVR').addEventListener('click',function(){ startApp(true); });
$('bNormal').addEventListener('click',function(){ startApp(false); });

resize();
})();
