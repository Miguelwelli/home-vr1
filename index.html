<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ping-Pong VR 6DOF</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0b0e14;--fg:#e8edf5;--ac:#35c4ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,14,.86);z-index:5;padding:16px}
#box{max-width:420px;text-align:center}
h1{margin:0 0 4px;font-size:28px;font-weight:600}
p{margin:6px 0;font-size:13px;line-height:1.5;opacity:.75}
button{display:block;width:100%;margin:10px 0 0;padding:13px;border:1px solid var(--ac);background:transparent;color:var(--fg);border-radius:12px;font-size:15px;cursor:pointer}
button.main{background:var(--ac);color:#04121a;font-weight:600}
button.vr-btn{background:#ab47bc;color:#fff;border-color:#ab47bc;font-weight:600;display:none}
#st{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);font-size:12px;opacity:.8;z-index:3;pointer-events:none}
#cv{position:fixed;right:10px;bottom:10px;width:110px;border-radius:8px;opacity:.85;z-index:3;display:none}
</style>
</head>
<body>
<div id="st"></div>
<video id="cv" playsinline muted></video>
<div id="ui"><div id="box">
<h1>Ping-Pong VR (6DOF)</h1>
<p>VR Headset (Meta Quest / Pico / Vive): Use o rastreamento 6DOF de cabeça e os controladores 6DOF.</p>
<p>Mouse = raquete · roda do mouse = profundidade · WASD = andar · Q/E = subir/descer · setas ou botão direito = olhar</p>
<button class="vr-btn" id="bWebXR">Entrar em VR (WebXR 6DOF)</button>
<button class="main" id="bPlay">Iniciar (Câmera / Mobile)</button>
<p id="msg" style="opacity:1;color:#ffcf5a"></p>
<button id="bSkip" style="display:none">Jogar sem câmera</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=id=>document.getElementById(id);
const R=0.035,G=9.8,TY=0.76,TW=1.525,TL=2.74,NET=0.1525;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const renderer=new T.WebGLRenderer({antialias:true, alpha: true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.autoClear=false;
renderer.xr.enabled = true; // Habilita WebXR Nativo
document.body.appendChild(renderer.domElement);

const scene=new T.Scene();scene.background=new T.Color(0x0b0e14);scene.fog=new T.Fog(0x0b0e14,7,16);
scene.add(new T.HemisphereLight(0xbfd8ff,0x222233,1));
const dl=new T.DirectionalLight(0xffffff,.8);dl.position.set(2,4,1);scene.add(dl);
const mat=(c,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.6},o||{}));
const box=(w,h,d,c,x,y,z,p)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);(p||scene).add(m);return m};

// Cenário
const floor=new T.Mesh(new T.PlaneGeometry(14,14),mat(0x141a26));floor.rotation.x=-Math.PI/2;scene.add(floor);
const grid=new T.GridHelper(14,28,0x35c4ff,0x1f2a3d);scene.add(grid);
// Mesa
box(TW,.04,TL,0x1a4fa0,0,TY-.02,0);
box(.02,.002,TL,0xffffff,0,TY+.001,0);
box(TW,.002,.02,0xffffff,0,TY+.001,0);
[-1,1].forEach(s=>{box(.02,.002,TL,0xffffff,s*(TW/2-.01),TY+.001,0);box(TW,.002,.02,0xffffff,0,TY+.001,s*(TL/2-.01))});
[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>box(.06,TY,.06,0x222a38,a*(TW/2-.1),TY/2,b*(TL/2-.15)));
const net=new T.Mesh(new T.PlaneGeometry(TW+.3,NET),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.3,side:T.DoubleSide}));
net.position.set(0,TY+NET/2,0);scene.add(net);box(TW+.3,.01,.01,0xffffff,0,TY+NET,0);

// Raquetes
function makePaddle(c){const g=new T.Group();
 const d=new T.Mesh(new T.CylinderGeometry(.15,.15,.015,32),mat(c));d.rotation.x=Math.PI/2;g.add(d);
 box(.035,.13,.02,0xc9a26b,0,-.2,0,g);scene.add(g);return g}
const paddle=makePaddle(0xe5333d);

// Robô
const rb=new T.Group();rb.position.z=-1.8;scene.add(rb);
box(.5,.7,.28,0x8896a8,0,1,0,rb);box(.3,.25,.25,0xaab6c6,0,1.55,0,rb);
box(.24,.07,.02,0x35c4ff,0,1.57,.13,rb).material=new T.MeshBasicMaterial({color:0x35c4ff});
box(.12,.5,.12,0x556070,-.12,.4,0,rb);box(.12,.5,.12,0x556070,.12,.4,0,rb);
const rpaddle=makePaddle(0x2299ff);
const armG=new T.CylinderGeometry(.04,.04,1,8);armG.rotateX(Math.PI/2);armG.translate(0,0,.5);
const arm=new T.Mesh(armG,mat(0x667385));scene.add(arm);
const rpad=new T.Vector3(0,1,-1.55);

// Placar 3D
const sc=document.createElement('canvas');sc.width=512;sc.height=256;
const stex=new T.CanvasTexture(sc);
const board=new T.Mesh(new T.PlaneGeometry(1.6,.8),new T.MeshBasicMaterial({map:stex}));
board.position.set(0,2.3,-2.6);scene.add(board);
let score=[0,0],msg='';
function drawScore(){const c=sc.getContext('2d');c.fillStyle='#0b0e14';c.fillRect(0,0,512,256);
 c.strokeStyle='#35c4ff';c.lineWidth=4;c.strokeRect(4,4,504,248);
 c.fillStyle='#e8edf5';c.textAlign='center';c.font='28px sans-serif';
 c.fillText('VOCÊ',130,60);c.fillText('ROBÔ',382,60);
 c.font='bold 110px sans-serif';c.fillText(score[0],130,170);c.fillText(score[1],382,170);c.fillText('–',256,165);
 c.font='28px sans-serif';c.fillStyle='#35c4ff';c.fillText(msg,256,225);stex.needsUpdate=true}
drawScore();

// Bola
const ball=new T.Mesh(new T.SphereGeometry(R,16,12),mat(0xffa31a,{emissive:0x553300}));scene.add(ball);
const bv=new T.Vector3(),P=ball.position;
const st={mode:'dead',last:'robot',bounces:0,serveOK:false,cool:0,dead:1};
P.set(0,1.2,-1.1);

// Áudio
let ac;const beep=(f,d)=>{if(!ac||muted)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.15;
 g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)};

function launch(power,toZ,tx){
 const dir=toZ<P.z?-1:1,vz=dir*(3+power*2.2),t=Math.abs((toZ-P.z)/vz);
 let vy=(TY+R-P.y+.5*G*t*t)/t;
 const tn=Math.abs(P.z/vz),yn=P.y+vy*tn-.5*G*tn*tn;
 if(Math.abs(P.z)>.05&&Math.sign(P.z)!==Math.sign(toZ)&&yn<1){vy=Math.max(vy,(1-P.y+.5*G*tn*tn)/tn)}
 bv.set(clamp((tx-P.x)/t,-2,2),vy,vz)}
function point(w){if(st.mode!=='play')return;st.mode='dead';st.dead=1.5;
 score[w==='player'?0:1]++;msg=w==='player'?'Ponto seu!':'Ponto do robô';drawScore();beep(w==='player'?660:200,.3)}
const other=s=>s==='player'?'robot':'player';
function onBounce(side){if(st.mode!=='play')return;beep(440,.08);
 if(st.bounces===0){
  if(side===st.last){if(st.serveOK)st.serveOK=false;else point(other(st.last))}
  else st.bounces=1;
 }else if(side!==st.last)point(st.last)}
function onFloor(){if(st.mode!=='play')return;point(st.bounces===0?other(st.last):st.last)}
function serve(){P.set((Math.random()-.5)*.4,1.2,-1.1);bv.set((Math.random()-.5)*.5,0,2.8);
 Object.assign(st,{mode:'play',last:'robot',bounces:0,serveOK:true,cool:.3});msg=''}

// Rigid Body & Camera Rig (Suporta WebXR 6DOF Nativo)
const rig=new T.Group();rig.position.set(0,0,1.4);scene.add(rig);
const camera=new T.PerspectiveCamera(75,1,.05,50);
camera.position.set(0,1.5,0);
rig.add(camera);

// Controllers WebXR 6DOF
const controllerR = renderer.xr.getController(0);
const controllerL = renderer.xr.getController(1);
rig.add(controllerR);
rig.add(controllerL);

let controllerActive = false;
controllerR.addEventListener('connected', () => controllerActive = true);
controllerR.addEventListener('disconnected', () => controllerActive = false);
controllerR.addEventListener('selectstart', () => { if(menuOn) act(hover); });

const pad=new T.Vector3(0,1.2,1.2),pv=new T.Vector3();
let lhand=null,menuOn=false,menuKey=false,menuLock=false,openT=0,diff=1.4,diffN=1,hover=-1,dwell=0,muted=false,camTex=null,bgOn=false,pCol=0,menuWas=false,mKey='',acc=0,seen=false;const mc=new T.Vector3(),lastL=new T.Vector3();
let hand=null,mouse={x:.5,y:.6,z:.9},lookYaw=0,lookPitch=-.15,vr=false,gyro=false,devQ=null,yawOff=0,keys={},joy={x:0,y:0};
const status=s=>$('st').textContent=s;

function updatePaddle(dt){
 let lx,ly,lz;
 if(renderer.xr.isPresenting || controllerActive){
   // Posição 6DOF do controle WebXR
   const cPos = new T.Vector3();
   const cRot = new T.Quaternion();
   controllerR.getWorldPosition(cPos);
   controllerR.getWorldQuaternion(cRot);
   paddle.position.copy(cPos);
   paddle.quaternion.copy(cRot);
   pv.lerp(cPos.clone().sub(pad).divideScalar(dt), .4);
   pad.copy(cPos);
   return;
 }
 
 if(hand&&performance.now()-hand.t<400){lx=(hand.x-.5)*2.6;ly=-.9+(1-hand.y)*1.7;lz=-(.2+clamp((hand.s-.06)/.14,0,1)*1.6);lastL.set(lx,ly,lz);seen=true}
 else if(seen){lx=lastL.x;ly=lastL.y;lz=lastL.z}
 else{lx=(mouse.x-.5)*1.8;ly=-.7+(1-mouse.y)*1.3;lz=-mouse.z}
 const tg=new T.Vector3(lx,ly,lz).add(rig.position),prev=pad.clone();
 pad.lerp(tg,1-Math.exp(-clamp(8+pad.distanceTo(tg)*80,8,40)*dt));
 pv.lerp(pad.clone().sub(prev).divideScalar(dt),.3);paddle.position.copy(pad)}

function playerHit(){
 const sp=clamp(pv.length()/3,0,1);
 launch(sp,-(.4+(.2+sp*.8)*.9),clamp(pv.x*.35+(P.x-pad.x)*3,-.6,.6));
 st.last='player';st.bounces=0;st.serveOK=false;st.cool=.25;beep(900,.07)}
function robotHit(){
 launch(.3+Math.random()*.5,.4+Math.random()*.8,(Math.random()-.5)*1.1);
 st.last='robot';st.bounces=0;st.serveOK=false;st.cool=.25;beep(700,.07)}
function robotAI(dt){
 let tx=0,ty=1;
 if(st.mode==='play'&&bv.z<0&&P.z<.3){tx=P.x;ty=clamp(P.y,.85,1.5)}
 const s=diff*dt;rpad.x+=clamp(tx-rpad.x,-s,s);rpad.y+=clamp(ty-rpad.y,-s*.9,s*.9);
 rb.position.x+=(rpad.x*.6-rb.position.x)*Math.min(1,dt*5);
 rpaddle.position.copy(rpad);
 const sh=new T.Vector3(rb.position.x+.3,1.2,rb.position.z+.1);
 arm.position.copy(sh);arm.lookAt(rpad);arm.scale.z=sh.distanceTo(rpad)}

// Menu (painel fixo)
const CW=420,CH=672,PW=.34,PH=.544,CTW=182;
const ITEMS=[['🔄','Zerar placar'],['🤖','Dificuldade'],['🎯','Recentralizar'],['🔊','Som'],['📷','Fundo câmera'],['🏓','Cor da raquete'],['🥽','Modo VR'],['🎾','Nova bola']];
const mCan=document.createElement('canvas');mCan.width=CW;mCan.height=CH;
const mTex=new T.CanvasTexture(mCan);
const menu=new T.Mesh(new T.PlaneGeometry(PW,PH),new T.MeshBasicMaterial({map:mTex,transparent:true,depthTest:false}));
menu.renderOrder=10;menu.visible=false;scene.add(menu);
const dot=new T.Mesh(new T.SphereGeometry(.018,12,8),new T.MeshBasicMaterial({color:0xb36bff,depthTest:false,transparent:true,opacity:.9}));
dot.renderOrder=12;dot.visible=false;scene.add(dot);
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function tileLabel(i){
 if(i===1)return['Dificuldade',['Fácil','Normal','Difícil'][diffN]];
 if(i===3)return['Som',muted?'Desligado':'Ligado'];
 if(i===4)return['Fundo câmera',bgOn?'Ligado':'Desligado'];
 if(i===5)return['Rastrear raquete',trk.on?'Ligado':'Calibrar'];
 if(i===6)return['Modo VR',vr?'Ligado':'Desligado'];
 return[ITEMS[i][1],'']}
function drawMenu(){const c=mCan.getContext('2d');c.clearRect(0,0,CW,CH);
 c.fillStyle='rgba(22,24,28,.95)';rr(c,0,0,CW,CH,44);c.fill();c.strokeStyle='rgba(255,255,255,.12)';c.lineWidth=3;c.stroke();
 c.textAlign='center';c.fillStyle=hover===8?'#35c4ff':'#e8edf5';c.font='bold 36px sans-serif';c.fillText('✕',CW-44,56);
 for(let i=0;i<8;i++){const x=20+(i%2)*(CTW+16),y=84+Math.floor(i/2)*134,L=tileLabel(i);
  c.fillStyle=i===hover?'rgba(53,196,255,.35)':'rgba(255,255,255,.08)';rr(c,x,y,CTW,118,22);c.fill();
  c.fillStyle='#fff';c.font='46px sans-serif';c.fillText(ITEMS[i][0],x+CTW/2,y+56);
  c.font='20px sans-serif';c.fillStyle='#e8edf5';c.fillText(L[0],x+CTW/2,y+86);
  if(L[1]){c.font='16px sans-serif';c.fillStyle='#35c4ff';c.fillText(L[1],x+CTW/2,y+106)}
  if(i===hover&&dwell>0){c.fillStyle='#35c4ff';c.fillRect(x+16,y+112,(CTW-32)*Math.min(dwell/.7,1),4)}}
 c.fillStyle='rgba(255,255,255,.9)';rr(c,CW/2-70,638,140,14,7);c.fill();
 mTex.needsUpdate=true}
function toggleMenu(){menuKey=!menuKey;menuOn=menuKey}
function act(i){
 if(i===8){menuKey=false;menuOn=false;menuLock=true}
 else if(i===0){score=[0,0];msg='';drawScore()}
 else if(i===1){diffN=(diffN+1)%3;diff=[.9,1.4,2.2][diffN]}
 else if(i===2){rig.position.set(0,0,1.4);lookYaw=0;lookPitch=-.15;devQ=null}
 else if(i===3){muted=!muted}
 else if(i===4){if(camTex){bgOn=!bgOn;scene.background=bgOn?camTex:new T.Color(0x0b0e14);floor.visible=grid.visible=!bgOn}}
 else if(i===5){if(trk.on){trk.on=false;trk.t=0}else{menuKey=false;menuOn=false;menuLock=true;calT=3}}
 else if(i===6){vr=!vr}
 else if(i===7){st.mode='dead';st.dead=.4}}
function updateMenu(dt){
 const now=performance.now(),fresh=lhand&&now-lhand.t<600,open=!!(fresh&&lhand.open);
 openT=open&&lhand.still?openT+dt:0;
 if(!open)menuLock=false;
 if(!menuOn&&open&&!menuLock&&openT>.8)menuOn=true;
 menu.visible=dot.visible=menuOn;paddle.visible=!menuOn;
 if(!menuOn){hover=-1;dwell=0;menuWas=false;return}
 const tg=fresh?new T.Vector3((lhand.x-.5)*1.8,-.7+(1-lhand.y)*1.3+PH/2+.08,0):new T.Vector3(-.3,.1,0);
 tg.x=clamp(tg.x,-.7,.7);tg.y=clamp(tg.y,-.2,.45);
 if(!menuWas){menu.position.set(rig.position.x+tg.x,rig.position.y+tg.y+1.2,rig.position.z-.8);menuWas=true;mKey=''}
 const hf=hand&&now-hand.t<400;
 const px=hf?(hand.ix-.5)*1.8:(mouse.x-.5)*1.8,py=hf?-.7+(1-hand.iy)*1.3:-.7+(1-mouse.y)*1.3;
 const wx=rig.position.x+px,wy=rig.position.y+py+1.2;dot.position.set(wx,wy,menu.position.z+.02);
 const cx=((wx-menu.position.x)/PW+.5)*CW,cy=(.5-(wy-menu.position.y)/PH)*CH;let h=-1;
 if(cx>CW-84&&cx<CW&&cy>0&&cy<80)h=8;
 else for(let i=0;i<8;i++){const x=20+(i%2)*(CTW+16),y=84+Math.floor(i/2)*134;if(cx>x&&cx<x+CTW&&cy>y&&cy<y+118)h=i}
 if(h>=0&&h===hover)dwell+=dt;else dwell=0;
 hover=h;
 if(dwell>=.7){const k=hover;dwell=-.6;act(k)}
 const k=hover+'|'+Math.round(dwell*20)+'|'+diffN+muted+bgOn+vr+pCol+trk.on;if(k!==mKey){mKey=k;drawMenu()}}

// Mãos (MediaPipe)
function sm(p,n){if(p&&n.t-p.t<300&&Math.hypot(n.x-p.x,n.y-p.y)<.25)for(const k of['x','y','ix','iy','s'])n[k]=p[k]+(n[k]-p[k])*.55;return n}
function setL(n){n=sm(lhand,n);n.still=!lhand||Math.hypot(n.x-lhand.x,n.y-lhand.y)<.03;lhand=n}
function onHands(r){
 const L=r.multiHandLandmarks||[],now=performance.now();
 const mk=l=>{const d=(a,b)=>Math.hypot(l[a].x-l[b].x,l[a].y-l[b].y),s=d(5,17);
  return{x:l[9].x,y:l[9].y,ix:l[8].x,iy:l[8].y,s,t:now,open:[[8,6],[12,10],[16,14],[20,18]].filter(([a,b])=>d(a,0)>d(b,0)*1.1).length>=3}};
 if(L.length>=2){const a=L.slice(0,2).sort((p,q)=>p[9].x-q[9].x);setL(mk(a[0]));{const nh=mk(a[1]);if(!padFresh())hand=sm(hand,nh)}status('Duas mãos ✓ · esq: '+(lhand.open?'aberta':'fechada'))}
 else if(L.length===1){const m=mk(L[0]),lab=r.multiHandedness&&r.multiHandedness[0]&&r.multiHandedness[0].label;if(!padFresh())hand=sm(hand,m);if(lab==='Right')setL(m);status('Mão detectada ✓ · '+(m.open?'palma aberta':'fechada'))}
 else status('Mostre a mão para a câmera')}

// Física
function physics(dt){
 if(menuOn)return;
 if(st.mode==='dead'){st.dead-=dt;if(st.dead<=0)serve();
  if(P.y>-1){bv.y-=G*dt;P.addScaledVector(bv,dt)}return}
 st.cool-=dt;const z0=P.z;
 bv.y-=G*dt;P.addScaledVector(bv,dt);
 if((z0>0)!==(P.z>0)&&P.y<TY+NET+R&&P.y>TY-.05&&Math.abs(P.x)<.92){bv.z*=-.15;bv.x*=.3;P.z=z0}
 if(P.y<TY+R&&bv.y<0&&Math.abs(P.x)<TW/2&&Math.abs(P.z)<TL/2&&P.y>TY-.15){
  P.y=TY+R;bv.y*=-.88;bv.x*=.98;bv.z*=.98;onBounce(P.z<0?'robot':'player')}
 if(P.y<R&&bv.y<0){P.y=R;bv.y*=-.5;onFloor()}
 if(st.mode==='play'&&st.cool<=0){
  if(bv.z>0&&Math.abs(P.z-pad.z)<.12&&Math.hypot(P.x-pad.x,P.y-pad.y)<.19)playerHit();
  else if(bv.z<0&&st.last==='player'&&st.bounces>=1&&P.z<rpad.z+.12&&P.z>rpad.z-.5&&Math.hypot(P.x-rpad.x,P.y-rpad.y)<.22)robotHit()}}

// Câmera e Orientação
const Y=new T.Vector3(0,1,0),X=new T.Vector3(1,0,0),zee=new T.Vector3(0,0,1),q1=new T.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));
function onOrient(e){if(e.alpha==null)return;
 const o=(screen.orientation&&screen.orientation.angle||0)*Math.PI/180,q=new T.Quaternion();
 q.setFromEuler(new T.Euler(e.beta*Math.PI/180,e.alpha*Math.PI/180,-e.gamma*Math.PI/180,'YXZ'));
 q.multiply(q1).multiply(new T.Quaternion().setFromAxisAngle(zee,-o));
 if(!devQ){const f=new T.Vector3(0,0,-1).applyQuaternion(q);yawOff=-Math.atan2(-f.x,-f.z)}if(devQ)devQ.slerp(q,.5);else devQ=q}

function updateCam(dt){
 if(renderer.xr.isPresenting) return; // 6DOF real nativo gerenciado pelo headset

 if(keys.ArrowLeft)lookYaw+=1.8*dt;if(keys.ArrowRight)lookYaw-=1.8*dt;
 if(keys.ArrowUp)lookPitch=clamp(lookPitch+1.2*dt,-1.2,1.2);if(keys.ArrowDown)lookPitch=clamp(lookPitch-1.2*dt,-1.2,1.2);
 const qy=new T.Quaternion().setFromAxisAngle(Y,lookYaw+(gyro&&devQ?yawOff:0));
 if(gyro&&devQ)camera.quaternion.copy(qy).multiply(devQ);
 else camera.quaternion.copy(qy).multiply(new T.Quaternion().setFromAxisAngle(X,lookPitch));
 camera.updateMatrixWorld();
 const f=new T.Vector3();camera.getWorldDirection(f);f.y=0;f.normalize();
 const r=new T.Vector3(-f.z,0,f.x);
 let mx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x,mz=(keys.KeyW?1:0)-(keys.KeyS?1:0)-joy.y,my=(keys.KeyE?1:0)-(keys.KeyQ?1:0);
 rig.position.addScaledVector(f,mz*1.6*dt).addScaledVector(r,mx*1.6*dt);rig.position.y+=my*1.2*dt;
 rig.position.set(clamp(rig.position.x,-2.2,2.2),clamp(rig.position.y,-.5,2.4),clamp(rig.position.z,.9,3.6))}

function render(){
 if(renderer.xr.isPresenting) {
   renderer.render(scene, camera);
   return;
 }
 const W=innerWidth,H=innerHeight;renderer.setScissorTest(false);renderer.setViewport(0,0,W,H);renderer.clear();
 if(!vr){camera.aspect=W/H;camera.updateProjectionMatrix();renderer.render(scene,camera);return}
 camera.aspect=(W/2)/H;camera.updateProjectionMatrix();renderer.setScissorTest(true);
 [-1,1].forEach((s,i)=>{const o=new T.Vector3(s*.032,0,0).applyQuaternion(camera.quaternion);
  camera.position.add(o);camera.updateMatrixWorld();
  renderer.setViewport(i*W/2,0,W/2,H);renderer.setScissor(i*W/2,0,W/2,H);renderer.render(scene,camera);
  camera.position.sub(o)})}
function resize(){renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();

// Rastreio de Raquete Real
const trk={on:false,hsv:[0,0,0],t:0},tcv=document.createElement('canvas'),_c=[0,0,0];tcv.width=96;tcv.height=72;
const tcx=tcv.getContext('2d',{willReadFrequently:true});let calT=0;
const ret=new T.Mesh(new T.RingGeometry(.035,.04,32),new T.MeshBasicMaterial({color:0x35c4ff,depthTest:false}));
ret.position.set(0,0,-.5);ret.renderOrder=13;ret.visible=false;camera.add(ret);
function padFresh(){return trk.on&&performance.now()-trk.t<300}
function rgb2hsv(r,g,b,o){r/=255;g/=255;b/=255;const m=Math.max(r,g,b),n=Math.min(r,g,b),d=m-n;let h=0;
 if(d){h=(m===r?((g-b)/d)%6:m===g?(b-r)/d+2:(r-g)/d+4)*60;if(h<0)h+=360}
 o[0]=h;o[1]=m?d/m:0;o[2]=m;return o}
function calibrate(){const v=$('cv');if(!v.videoWidth)return false;
 tcx.drawImage(v,0,0,96,72);const d=tcx.getImageData(40,30,16,12).data,n=d.length/4;let r=0,g=0,b=0;
 for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}
 rgb2hsv(r/n,g/n,b/n,trk.hsv);trk.on=true;trk.t=0;return true}
function trackPaddle(){const v=$('cv');if(!v.videoWidth)return;
 tcx.drawImage(v,0,0,96,72);const d=tcx.getImageData(0,0,96,72).data,H=trk.hsv[0],S=trk.hsv[1],V=trk.hsv[2],px=[];
 for(let i=0,p=0;i<d.length;i+=4,p++){rgb2hsv(d[i],d[i+1],d[i+2],_c);let dh=Math.abs(_c[0]-H);dh=Math.min(dh,360-dh);
  if(dh<18&&_c[1]>.25&&Math.abs(_c[1]-S)<.3&&Math.abs(_c[2]-V)<.35)px.push(p)}
 if(px.length<25)return;
 let mx=0,my=0;for(const p of px){mx+=p%96;my+=(p/96)|0}mx/=px.length;my/=px.length;
 let n=0,sx=0,sy=0;for(const p of px){const x=p%96,y=(p/96)|0;if(Math.hypot(x-mx,y-my)<24){n++;sx+=x;sy+=y}}
 if(n<25)return;
 trk.t=performance.now();
 hand=sm(hand,{x:sx/n/96,y:sy/n/72,ix:sx/n/96,iy:sy/n/72,s:.06+clamp((Math.sqrt(n/6912)-.05)/.3,0,1)*.14,t:trk.t,open:false})}
function trackTick(dt){
 if(calT>0){ret.visible=true;calT-=dt;status('Segure a raquete no centro: '+Math.ceil(calT));
  if(calT<=0){ret.visible=false;status(calibrate()?'Raquete calibrada ✓':'Câmera não está pronta')}}
 if(trk.on)trackPaddle()}

// Loop WebXR Nativo
let last=performance.now();
renderer.setAnimationLoop((now) => {
 const dt=Math.min((now-last)/1000,.05);last=now;
 updateCam(dt);trackTick(dt);updatePaddle(Math.max(dt,.001));updateMenu(dt);
 acc+=dt;let ns=0;while(acc>=1/180&&ns<12){physics(1/180);acc-=1/180;ns++}if(ns===12)acc=0;
 robotAI(dt);render();
});

// Suporte WebXR API & Suporte Hídrico 6DOF
if('xr' in navigator){
  navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
    if(supported){
      $('bWebXR').style.display = 'block';
    }
  });
}

async function startWebXR(){
  if(!navigator.xr) return;
  const session = await navigator.xr.requestSession('immersive-vr', {
    optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
  });
  renderer.xr.setSession(session);
  $('ui').style.display='none';
}

// Eventos de entrada
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyM')toggleMenu()});addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousemove',e=>{mouse.x=e.clientX/innerWidth;mouse.y=e.clientY/innerHeight;
 if(e.buttons&2){lookYaw-=e.movementX*.004;lookPitch=clamp(lookPitch-e.movementY*.004,-1.2,1.2)}});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{mouse.z=clamp(mouse.z+e.deltaY*.001,.3,1.5)},{passive:true});
let tL=null,tR=null;
addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(t.clientX<innerWidth/2)tL={id:t.identifier,x:t.clientX,y:t.clientY};else tR={id:t.identifier,x:t.clientX,y:t.clientY}}},{passive:true});
addEventListener('touchmove',e=>{for(const t of e.changedTouches){
 if(tL&&t.identifier===tL.id){joy.x=clamp((t.clientX-tL.x)/60,-1,1);joy.y=clamp((t.clientY-tL.y)/60,-1,1)}
 if(tR&&t.identifier===tR.id){lookYaw-=(t.clientX-tR.x)*.005;lookPitch=clamp(lookPitch-(t.clientY-tR.y)*.005,-1.2,1.2);tR.x=t.clientX;tR.y=t.clientY}}},{passive:true});
addEventListener('touchend',e=>{for(const t of e.changedTouches){if(tL&&t.identifier===tL.id){tL=null;joy.x=joy.y=0}if(tR&&t.identifier===tR.id)tR=null}},{passive:true});

// MediaPipe Hands
const loadScript=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
let camOk=false;
async function startHand(){
 const base='https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/';
 try{
  status('Pedindo permissão da câmera…');
  const v=$('cv'),stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:640,height:480,frameRate:{ideal:30}},audio:false});
  v.srcObject=stream;v.style.display='block';await v.play();
  camTex=scene.background=new T.VideoTexture(v);bgOn=true;floor.visible=false;grid.visible=false;camOk=true;$('ui').style.display='none';
  status('Carregando MediaPipe…');await loadScript(base+'hands.js');
  const hands=new Hands({locateFile:f=>base+f});
  hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.5});
  hands.onResults(r=>onHands(r));
  let busy=false,err=0;
  (async function lp(){if(err>5){status('Rastreio falhou: usando mouse');return}
   if(!busy){busy=true;try{await hands.send({image:v})}catch(e){err++}busy=false}
   requestAnimationFrame(lp)})();
 }catch(e){if(camOk)status('MediaPipe indisponível: usando mouse');else{status('');$('ui').style.display='flex';$('msg').textContent='Câmera não autorizada ('+(e&&e.name||'erro')+'). Toque em Tentar de novo e permita; se nenhum aviso aparecer, abra o link direto no Chrome ou Safari.';$('bPlay').textContent='Tentar de novo';$('bSkip').style.display='block'}}}

async function enableVR(){
 try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
   if(await DeviceOrientationEvent.requestPermission()!=='granted')throw 0}
  addEventListener('deviceorientation',onOrient);gyro=true}catch(e){status('Giroscópio indisponível')}
 vr=true;
 try{await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape')}catch(e){}}

const start=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}};
$('bWebXR').onclick=()=>{start();startWebXR()};
$('bPlay').onclick=async()=>{start();$('msg').textContent='Permita o giroscópio e a câmera quando o aviso aparecer…';await enableVR();startHand()};
$('bSkip').onclick=()=>{$('ui').style.display='none'};
</script>
