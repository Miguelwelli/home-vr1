<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ping Pong VR</title>
<style>
:root{--bg:#070b14;--fg:#e8eefc;--mu:#8b97b5;--ac:#3de0ff;--card:rgba(12,18,34,.78);--ln:rgba(255,255,255,.12);color-scheme:dark}
:root[data-theme="dark"]{--bg:#070b14}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:radial-gradient(ellipse at center,rgba(7,11,20,.3),rgba(7,11,20,.88))}
.card{width:min(360px,100%);background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:20px;padding:24px;text-align:center}
h1{margin:0;font-size:26px;letter-spacing:.22em;font-weight:700}
.sub{color:var(--mu);font-size:13px;margin:6px 0 20px}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--ln);background:transparent;color:var(--mu);font:inherit;font-size:13px}
.seg button.on{color:var(--fg);border-color:var(--ac);background:rgba(61,224,255,.1)}
.btn{display:block;width:100%;padding:14px;margin-top:8px;border-radius:12px;border:1px solid var(--ln);background:rgba(255,255,255,.05);color:var(--fg);font:inherit;font-weight:600}
.btn.p{background:var(--ac);color:#04121a;border-color:var(--ac)}
.btn:disabled{opacity:.35}
#st{color:var(--mu);font-size:12px;margin-top:14px;min-height:1.4em}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;display:none;gap:8px}
#hud button{width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:var(--card);color:var(--fg);font-size:18px}
#pv{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;width:96px;height:72px;border-radius:10px;border:1px solid var(--ln);display:none;opacity:.85}
#tip{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font-size:13px;color:var(--fg);pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><button id="x" aria-label="Sair">✕</button><button id="rc" aria-label="Recentralizar">⟲</button></div>
<canvas id="pv" width="64" height="48"></canvas><div id="tip"></div>
<div id="menu"><div class="card">
<h1>PING PONG</h1>
<div class="sub">Você contra o robô · primeiro a 11</div>
<div class="seg" id="df"><button data-d="0">Fácil</button><button data-d="1" class="on">Normal</button><button data-d="2">Difícil</button></div>
<div class="sub" style="margin:0 0 6px;text-align:left">Rastrear mão com a câmera</div>
<div class="seg" id="cm"><button data-c="off" class="on">Desligada</button><button data-c="environment">Traseira</button><button data-c="user">Frontal</button></div>
<button class="btn p" id="bxr" disabled>Entrar em VR</button>
<button class="btn" id="bsc">Jogar na tela · giroscópio</button>
<button class="btn" id="bst">Modo VR Box</button>
<div id="st"></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const R=THREE,$=s=>document.querySelector(s),TY=.76,BR=.028,G=9.81,NET=TY+.1525,
rnd=(a,b)=>a+Math.random()*(b-a),clamp=R.MathUtils.clamp;

/* ---------- cena ---------- */
const cv=$('#c'),rd=new R.WebGLRenderer({canvas:cv,antialias:true});
rd.setPixelRatio(Math.min(devicePixelRatio,2));rd.xr.enabled=true;rd.xr.setReferenceSpaceType('local-floor');
const sc=new R.Scene();sc.background=new R.Color(0x070b14);sc.fog=new R.Fog(0x070b14,9,24);
const rig=new R.Group();rig.position.set(0,0,1.8);sc.add(rig);
const cam=new R.PerspectiveCamera(70,1,.05,60);cam.position.set(0,1.45,.3);rig.add(cam);
const ster=new R.StereoCamera();ster.eyeSep=.064;
sc.add(new R.HemisphereLight(0xcfe3ff,0x101830,1));
const dl=new R.DirectionalLight(0xffffff,.8);dl.position.set(2,5,3);sc.add(dl);
const M=(c,o)=>new R.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:0},o)),
B=c=>new R.MeshBasicMaterial({color:c}),
add=(g,m,x,y,z,p)=>{const o=new R.Mesh(g,m);o.position.set(x,y,z);(p||sc).add(o);return o};

const fl=add(new R.CircleGeometry(14,64),M(0x0d1424,{roughness:1}),0,0,0);fl.rotation.x=-Math.PI/2;
const gr=new R.GridHelper(28,56,0x1f2b48,0x141c30);gr.position.y=.002;sc.add(gr);

/* mesa */
const LN=B(0xffffff);
add(new R.BoxGeometry(1.525,.04,2.74),M(0x153a9c,{roughness:.45}),0,TY-.02,0);
add(new R.BoxGeometry(.008,.002,2.74),LN,0,TY+.001,0);
[-.757,.757].forEach(x=>add(new R.BoxGeometry(.012,.002,2.74),LN,x,TY+.001,0));
[-1.357,1.357].forEach(z=>add(new R.BoxGeometry(1.525,.002,.012),LN,0,TY+.001,z));
[[-.7,-1.25],[.7,-1.25],[-.7,1.25],[.7,1.25]].forEach(([x,z])=>add(new R.BoxGeometry(.05,TY-.04,.05),M(0x20283d),x,(TY-.04)/2,z));
add(new R.PlaneGeometry(1.83,.1525),new R.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.45,side:R.DoubleSide}),0,TY+.076,0);
add(new R.BoxGeometry(1.83,.012,.012),LN,0,NET,0);
[-.915,.915].forEach(x=>add(new R.BoxGeometry(.02,.17,.02),M(0x20283d),x,TY+.085,0));

/* bola */
const ball={p:new R.Vector3(0,1.05,1),v:new R.Vector3()};
const bm=add(new R.SphereGeometry(BR,20,14),B(0xff8a1f),0,0,0);
const shd=add(new R.CircleGeometry(.05,16),new R.MeshBasicMaterial({color:0,transparent:true,opacity:.4,depthWrite:false}),0,0,0);shd.rotation.x=-Math.PI/2;

/* raquetes */
function mk(c){const g=new R.Group(),v=new R.Group();g.add(v);sc.add(g);
const bl=new R.Mesh(new R.CylinderGeometry(.085,.085,.014,32).rotateX(Math.PI/2),[M(0x2a2018),M(c,{roughness:.8}),M(0x111111)]);
const h=new R.Mesh(new R.BoxGeometry(.028,.1,.02),M(0xc99a62));h.position.y=-.13;v.add(bl,h);return{g,v}}
const P=mk(0xe0344f),pad=P.g;P.v.rotation.x=-Math.PI/2;P.v.position.set(0,0,-.12);pad.visible=false;
const Q=mk(0x3d8bff),rp=Q.g;rp.position.set(0,.95,-1.6);

/* robô */
const rb=new R.Group();rb.position.set(0,0,-2.15);sc.add(rb);
add(new R.CylinderGeometry(.3,.34,.06,32),M(0x1a2238,{metalness:.5}),0,.03,0,rb);
add(new R.CylinderGeometry(.2,.26,.8,24),M(0x232d4a,{metalness:.5,roughness:.4}),0,.46,0,rb);
add(new R.SphereGeometry(.15,24,16),M(0xe6edff,{roughness:.3}),0,1,0,rb);
add(new R.BoxGeometry(.2,.06,.05),B(0x3de0ff),0,1,.13,rb);
const S=new R.Vector3(.26,.78,-2.15);add(new R.SphereGeometry(.05,12,10),M(0x3a4668),S.x,S.y,S.z);
const arm=add(new R.CylinderGeometry(.03,.03,1,10),M(0x3a4668),0,0,0),UP=new R.Vector3(0,1,0),dd=new R.Vector3();
function armUpd(){dd.copy(rp.position).sub(S);const l=dd.length();arm.position.copy(S).addScaledVector(dd,.5);arm.scale.set(1,l,1);arm.quaternion.setFromUnitVectors(UP,dd.normalize())}

/* mãos (hand tracking) */
const HG=new R.SphereGeometry(1,8,6),HM=new R.MeshBasicMaterial({color:0x3de0ff,transparent:true,opacity:.55});
const hands=[0,1].map(()=>{const g=new R.Group();for(let i=0;i<25;i++)g.add(new R.Mesh(HG,HM));g.visible=false;sc.add(g);return g});

/* placar 3D */
const bc=document.createElement('canvas');bc.width=1024;bc.height=300;
const bx=bc.getContext('2d'),bt=new R.CanvasTexture(bc);
add(new R.PlaneGeometry(3.4,1),new R.MeshBasicMaterial({map:bt,transparent:true}),0,2.15,-3.2);
const score={p:0,r:0};let msg='';
function board(){bx.clearRect(0,0,1024,300);bx.textAlign='center';
bx.font='600 34px system-ui,sans-serif';bx.fillStyle='#8b97b5';bx.fillText('VOCÊ',250,60);bx.fillText('ROBÔ',774,60);
bx.font='700 150px system-ui,sans-serif';bx.fillStyle='#3de0ff';bx.fillText(score.p,250,200);
bx.fillStyle='#ff8a1f';bx.fillText(score.r,774,200);bx.fillStyle='#8b97b5';bx.fillText('–',512,190);
bx.font='500 36px system-ui,sans-serif';bx.fillStyle='#e8eefc';bx.fillText(msg,512,270);bt.needsUpdate=true}

/* áudio */
let ac;const tone=(f,d,t,v)=>{if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;
o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
o.connect(g);g.connect(ac.destination);o.start();o.stop(n+d)};

/* ---------- estado ---------- */
let mode='menu',xr=false,stereo=false,st='wait',last=null,bounces=0,sf=false,tm=0,over=false,lv=1,server='p',rc=0,t0=0,lt=0,fi=true,curSrc=null;
const pv=new R.Vector3(),pp=new R.Vector3(),bp=new R.Vector3(),raw=new R.Vector3(),tmp=new R.Vector3(),
ptr={x:0,y:.4},tgt=new R.Vector3(0,1.05,1.2),
qS=new R.Quaternion().setFromEuler(new R.Euler(0,Math.PI,0)).multiply(new R.Quaternion().setFromAxisAngle(new R.Vector3(1,0,0),Math.PI/2));

function next(){
 if(over){score.p=score.r=0;over=false}
 server=Math.floor((score.p+score.r)/2)%2?'r':'p';last=null;bounces=0;sf=false;ball.v.set(0,0,0);
 if(server==='p'){st='wait';msg='Seu saque';ball.p.set(0,1.05,1)}
 else{st='play';msg='Saque do robô';ball.p.set(rnd(-.3,.3),1.25,-1.5);ball.v.set(rnd(-.3,.3),0,3.2);last='r';sf=true;tone(300,.08,'square',.1)}
 board()}
function scored(w,m){
 if(st!=='play')return;score[w]++;st='pause';tm=1.6;
 over=Math.max(score.p,score.r)>=11&&Math.abs(score.p-score.r)>=2;
 msg=over?(w==='p'?'Você venceu!':'O robô venceu'):(w==='p'?'Ponto seu':'Ponto do robô')+(m?' · '+m:'');
 if(over)tm=3.5;tone(w==='p'?880:240,.3,'sine',.14);board()}
function out(){if(st!=='play')return;scored(last&&bounces>=1?last:(last==='p'?'r':'p'))}
function onBounce(sd){
 if(st!=='play'||!last)return;
 if(sd===last){if(sf){sf=false;return}scored(last==='p'?'r':'p','falta');return}
 sf=false;bounces++;if(bounces>=2)scored(last)}

/* lança a bola para um ponto da mesa adversária */
function aim(tx,tz,T0){
 const b=ball.p;let T=T0;
 for(;T<1.4;T+=.03){const vy=(TY+BR-b.y+.5*G*T*T)/T,vz=(tz-b.z)/T,tn=-b.z/vz;
  if(!(tn>0&&tn<T))break;if(b.y+vy*tn-.5*G*tn*tn>NET+.07)break}
 ball.v.set((tx-b.x)/T,(TY+BR-b.y+.5*G*T*T)/T,(tz-b.z)/T)}

function buzz(){try{curSrc&&curSrc.gamepad.hapticActuators[0].pulse(.7,60)}catch(e){}}
function tryHit(){
 if(rc>0||(st==='play'&&last==='p'))return;
 const b=ball.p,zs=xr?1:.55,dx=b.x-bp.x,dy=b.y-bp.y,dz=(b.z-bp.z)*zs;
 if(b.z<.05||dx*dx+dy*dy+dz*dz>.0289)return;
 const sp=Math.min(Math.max(pv.length(),xr?0:2.5),6);
 aim(clamp(b.x*.4+pv.x*.3+dx*3,-.6,.6),-.5-sp*.13,clamp(.9-sp*.07,.45,.9));
 st='play';last='p';bounces=0;sf=false;rc=.3;msg='';board();tone(260,.08,'square',.12);buzz()}
function robotHit(){
 if(rc>0||last!=='p'||bounces!==1||ball.v.z>=0||ball.p.distanceTo(rp.position)>.2)return;
 const miss=Math.random()<[.3,.14,.05][lv];
 const tx=miss?(Math.random()<.5?-1:1)*rnd(.9,1.2):clamp(-bp.x*.7+rnd(-.3,.3),-.62,.62);
 aim(tx,rnd(.45,1.05),[.88,.72,.56][lv]+rnd(0,.08));
 last='r';bounces=0;rc=.3;tone(420,.07,'square',.1)}

function step(h){
 rc-=h;
 if(st==='wait'){ball.p.set(0,1.05+Math.sin(t0*3)*.02,1);tryHit();return}
 const b=ball.p,v=ball.v,oz=b.z;
 v.y-=G*h;b.addScaledVector(v,h);
 if(v.y<0&&b.y-BR<=TY&&b.y-BR>TY-.12&&Math.abs(b.x)<.7625+BR&&Math.abs(b.z)<1.37+BR){
  b.y=TY+BR;v.y*=-.9;v.x*=.98;v.z*=.98;tone(560,.05,'triangle',.12);onBounce(b.z>0?'p':'r')}
 if(b.y<BR){b.y=BR;if(st==='play')out();else{v.y*=-.5;v.x*=.8;v.z*=.8}}
 if(st==='play'){
  if(oz*b.z<0&&b.y<NET+BR&&b.y>TY&&Math.abs(b.x)<.92){b.z=oz;v.z*=-.1;v.x*=.3;scored(last==='p'?'r':'p','rede')}
  else{tryHit();robotHit()}
  if(Math.abs(b.z)>4.5||Math.abs(b.x)>3.5||b.y>6)out()}}

function robot(dt){
 const a=last==='p'&&st==='play';
 tmp.set(a?clamp(ball.p.x+ball.v.x*.08,-1,1):0,a?clamp(ball.p.y,.87,1.5):.95,a?clamp(ball.p.z,-1.95,-1.4):-1.6);
 const sp=[1.8,2.8,4.4][lv]*dt,d=tmp.sub(rp.position),l=d.length();
 rp.position.addScaledVector(d,l>sp?sp/l:1);armUpd()}

/* ---------- entrada ---------- */
const gy={ok:false,a:0,b:0,g:0,a0:null};
addEventListener('deviceorientation',e=>{if(e.alpha==null)return;gy.ok=true;gy.a=e.alpha;gy.b=e.beta;gy.g=e.gamma;if(gy.a0==null)gy.a0=e.alpha});
const eu=new R.Euler(),q1=new R.Quaternion(-Math.SQRT1_2,0,0,Math.SQRT1_2),q0=new R.Quaternion(),zee=new R.Vector3(0,0,1);
function gyro(){const d=R.MathUtils.degToRad,o=d(screen.orientation?screen.orientation.angle:(window.orientation||0));
 eu.set(d(gy.b),d(gy.a-gy.a0),-d(gy.g),'YXZ');cam.quaternion.setFromEuler(eu).multiply(q1).multiply(q0.setFromAxisAngle(zee,-o))}
const pm=e=>{ptr.x=e.clientX/innerWidth*2-1;ptr.y=1-e.clientY/innerHeight};
cv.addEventListener('pointermove',pm);cv.addEventListener('pointerdown',pm);

function updXR(f){
 const s=rd.xr.getSession(),ref=rd.xr.getReferenceSpace();if(!s||!ref||!f)return;
 let m=null,hi=0;hands.forEach(h=>h.visible=false);curSrc=null;
 for(const src of s.inputSources){let t=null;
  if(src.hand){const hm=hands[hi++];if(!hm)continue;hm.visible=true;let i=0;
   for(const j of src.hand.values()){const jp=f.getJointPose(j,ref),c=hm.children[i++];if(!c)continue;
    if(jp){const p=jp.transform.position;c.visible=true;c.position.set(p.x,p.y,p.z).add(rig.position);c.scale.setScalar(jp.radius||.01)}else c.visible=false}
   const w=src.hand.get('wrist'),wp=w&&f.getJointPose(w,ref);if(wp)t=wp.transform}
  else if(src.targetRaySpace){const p=f.getPose(src.targetRaySpace,ref);if(p)t=p.transform}
  if(t&&(!m||src.handedness==='right')){m=t;curSrc=src.hand?null:src}}
 if(m){pad.visible=true;pad.position.set(m.position.x,m.position.y,m.position.z).add(rig.position);
  pad.quaternion.set(m.orientation.x,m.orientation.y,m.orientation.z,m.orientation.w)}else pad.visible=false}

/* ---------- câmera: rastreio de mão por cor de pele ---------- */
let camMode='off',vid=null,vstream=null,hs=0;
const hc={on:false,x:.5,y:.5,seen:0,front:false},pvc=$('#pv'),pvx=pvc.getContext('2d'),wk=document.createElement('canvas');
wk.width=64;wk.height=48;const wx=wk.getContext('2d',{willReadFrequently:true});
const tip=s=>{$('#tip').textContent=s;if(s)setTimeout(()=>{$('#tip').textContent=''},7000)};
function camStop(){hc.on=false;hc.seen=0;pvc.style.display='none';if(vstream)vstream.getTracks().forEach(t=>t.stop());vstream=null;vid=null}
async function camStart(m){
 camStop();
 try{vstream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:m},width:{ideal:320},height:{ideal:240}},audio:false});
  vid=document.createElement('video');vid.muted=true;vid.playsInline=true;vid.setAttribute('playsinline','');vid.srcObject=vstream;await vid.play();
  hc.on=true;hc.front=m==='user';hc.x=.5;hc.y=.5;pvc.style.display='block';pvc.style.transform=hc.front?'scaleX(-1)':'none';return true}
 catch(e){camStop();return false}}
function handScan(){
 if(!vid||vid.readyState<2)return;
 wx.drawImage(vid,0,0,64,48);const d=wx.getImageData(0,0,64,48).data,im=pvx.createImageData(64,48),q=im.data;let sx=0,sy=0,n=0;
 for(let i=0,p=0;i<d.length;i+=4,p++){
  const r=d[i],g=d[i+1],b=d[i+2],Y=.299*r+.587*g+.114*b,cr=(r-Y)*.713+128,cb=(b-Y)*.564+128;
  if(Y>50&&cr>137&&cr<175&&cb>77&&cb<127){sx+=p%64;sy+=(p/64)|0;n++;q[i]=61;q[i+1]=224;q[i+2]=255}
  else{q[i]=r>>2;q[i+1]=g>>2;q[i+2]=b>>2}
  q[i+3]=255}
 if(n>45){const x=sx/n/64,y=sy/n/48;hc.x+=(x-hc.x)*.6;hc.y+=(y-hc.y)*.6;hc.seen=performance.now()}
 pvx.putImageData(im,0,0);pvx.fillStyle='#ff8a1f';pvx.fillRect(hc.x*64-2,hc.y*48-2,4,4)}

/* ---------- loop ---------- */
function render(){
 if(stereo){const W=innerWidth,H=innerHeight;cam.aspect=W/2/H;cam.updateProjectionMatrix();cam.updateMatrixWorld(true);ster.update(cam);
  rd.setScissorTest(true);rd.setViewport(0,0,W/2,H);rd.setScissor(0,0,W/2,H);rd.render(sc,ster.cameraL);
  rd.setViewport(W/2,0,W/2,H);rd.setScissor(W/2,0,W/2,H);rd.render(sc,ster.cameraR);rd.setScissorTest(false)}
 else rd.render(sc,cam)}
function loop(t,frame){
 const dt=Math.min(Math.max((t-(lt||t))/1000,.001),.05);lt=t;t0=t/1000;
 if(mode==='menu'){
  const a=t0*.15;cam.position.set(Math.sin(a)*.8,1.5,.3);cam.lookAt(0,.9,-.5);ball.p.set(0,1.05+Math.sin(t0*3)*.02,1);robot(dt)}
 else{
  if(hc.on&&t-hs>33){hs=t;handScan()}
  if(xr)updXR(frame);
  else{
   let tx=ptr.x*.85,ty=.8+ptr.y*.75;
   if(hc.on&&performance.now()-hc.seen<400){tx=clamp((hc.front?.5-hc.x:hc.x-.5)*2.4,-.85,.85);ty=clamp(1.15+(.5-hc.y)*1.5,.8,1.55)}
   tgt.lerp(tmp.set(tx,ty,1.2),1-Math.exp(-22*dt));
   pad.visible=true;pad.quaternion.copy(qS);pad.position.copy(tgt).sub(tmp.set(0,0,-.12).applyQuaternion(qS));
   if(gy.ok&&gy.a0!=null)gyro();else cam.lookAt(0,.95,-.4)}
  pad.updateMatrixWorld(true);P.v.getWorldPosition(bp);
  if(fi){pp.copy(bp);pv.set(0,0,0);fi=false}
  pv.lerp(raw.copy(bp).sub(pp).divideScalar(dt),.5);pp.copy(bp);
  if(st==='pause'){tm-=dt;if(tm<=0)next()}
  const n=Math.ceil(dt/.004);for(let i=0;i<n;i++)step(dt/n);
  robot(dt)}
 bm.position.copy(ball.p);
 const onT=Math.abs(ball.p.x)<.76&&Math.abs(ball.p.z)<1.37&&ball.p.y>TY-.02;
 shd.position.set(ball.p.x,onT?TY+.003:.004,ball.p.z);shd.scale.setScalar(clamp(1.3-(ball.p.y-(onT?TY:0))*.3,.4,1.3));
 render()}
rd.setAnimationLoop(loop);

/* ---------- fluxo ---------- */
function resize(){const W=innerWidth,H=innerHeight;rd.setSize(W,H,false);cam.aspect=stereo?W/2/H:W/H;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
function exit(){
 camStop();xr=false;stereo=false;mode='menu';cam.position.set(0,1.45,.3);cam.quaternion.identity();pad.visible=false;hands.forEach(h=>h.visible=false);
 $('#menu').style.display='flex';$('#hud').style.display='none';
 try{document.fullscreenElement&&document.exitFullscreen();screen.orientation.unlock()}catch(e){}
 resize();score.p=score.r=0;over=false;next()}
async function go(m){
 try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
 if(m==='xr'){
  const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor','hand-tracking']});
  await rd.xr.setSession(s);xr=true;s.addEventListener('end',exit)}
 else{
  try{const D=window.DeviceOrientationEvent;if(D&&D.requestPermission)await D.requestPermission()}catch(e){}
  gy.a0=gy.ok?gy.a:null;stereo=m==='stereo';
  try{await document.documentElement.requestFullscreen()}catch(e){}
  if(stereo){try{await screen.orientation.lock('landscape')}catch(e){}}
  if(camMode!=='off'&&!(await camStart(camMode)))tip('Câmera bloqueada ou indisponível');
  setTimeout(()=>{if(mode!=='menu'&&!gy.ok)tip('Giroscópio indisponível · abra o link direto no navegador e permita "Movimento e orientação"')},1500)}
 mode=m;fi=true;score.p=score.r=0;over=false;next();
 $('#menu').style.display='none';$('#hud').style.display=xr?'none':'flex';resize()}
$('#bxr').onclick=()=>go('xr').catch(e=>{$('#st').textContent='Não foi possível iniciar o VR'});
$('#bsc').onclick=()=>go('screen');
$('#bst').onclick=()=>go('stereo');
$('#x').onclick=exit;
$('#rc').onclick=()=>{if(gy.ok)gy.a0=gy.a};
$('#df').onclick=e=>{const b=e.target.closest('button');if(!b)return;lv=+b.dataset.d;[...$('#df').children].forEach(x=>x.classList.toggle('on',x===b))};
$('#cm').onclick=e=>{const b=e.target.closest('button');if(!b)return;camMode=b.dataset.c;[...$('#cm').children].forEach(x=>x.classList.toggle('on',x===b))};
const stt=$('#st');
if(navigator.xr)navigator.xr.isSessionSupported('immersive-vr').then(ok=>{$('#bxr').disabled=!ok;stt.textContent=ok?'Mãos ou controles · 6DOF':'VR imersivo indisponível neste dispositivo'}).catch(()=>{});
else stt.textContent='WebXR indisponível neste navegador';
next();
})();
</script>
